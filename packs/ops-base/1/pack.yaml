# Pack Contract v1 (S11 P1-C / P1-D; docs/s10-evolution-plan-2026-10-04.md §6.2, §6.5): one
# immutable PackVersion. The shape and the rules a manifest keeps are
# `packages/kernel/src/application/packs/manifest.ts`; the Skill and Worker files beside it, and
# the rules across manifests, are its `registry.ts`.
#
# ops-base v1 ships the general ops Worker and its first Skill. The ops-assets ontology stays its
# own pack (a family belongs to one pack); connector presets and binding the Worker to a
# workspace's systems join in a later version (S11 P1-E).
#
# `summary` and `notes` are read by workspace owners in the console (the pack's detail and the
# install review): plain words, no type or field names.
schema: 1
name: ops-base
version: 1
summary: >-
  运维基础：一个通用运维执行者和它的排查方法，用来调查主机与容器上的问题。
# One line each: folding a Chinese sentence over lines puts a space where the lines meet.
notes: 安装后工作区多一个运维执行者和一份容器排查方法。执行者会先查台账里记录的主机、容器和它们的状态，再用已接入系统的只读查询核实，最后给出原因判断和带证据的处理建议。它不能自己改动任何系统：需要重启或修改时，由调用它的助手发起审批，由人决定。
breaking: false
components:
  skills:
    - docker-triage
  workers:
    - ops-runner
