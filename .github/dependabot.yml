version: 2

# docs/runbooks/pi-upgrade.md "依赖自动化". Two update configs, both scoped to exactly the
# coupling surface this repo's pi integration touches (see the runbook's inventory table for the
# rest of that surface, which is code, not a dependency version, and so isn't dependabot's job):
#
#   - npm, packages/platform-extension: the one package.json that pins pi
#     (`@earendil-works/pi-coding-agent` in `dependencies`, `@earendil-works/pi-ai` in
#     `devDependencies` — see that package's own package.json). Grouped as `pi` so both land in
#     one weekly PR instead of two independent ones that could merge out of order; every PR from
#     this directory (grouped or not — this directory has very few other deps) is labelled
#     `pi-upgrade` for visibility. No `ignore:` — nothing in this small, pi-adjacent package's
#     dependency set is exempted from updates.
#   - docker, deploy/worker-runtime: the worker-runtime image's base image
#     (`node:24-bookworm-slim`) is pinned by tag, not digest — Dependabot's docker ecosystem
#     tracks that tag.
updates:
  - package-ecosystem: npm
    directory: /packages/platform-extension
    schedule:
      interval: weekly
    groups:
      pi:
        patterns:
          - '@earendil-works/*'
    labels:
      - pi-upgrade

  - package-ecosystem: docker
    directory: /deploy/worker-runtime
    schedule:
      interval: weekly
