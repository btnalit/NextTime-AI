name: e2e

# Web console Playwright e2e (docs/runbooks/web-console.md "CI（Playwright）"). A separate
# workflow from ci.yml on purpose: it brings up its own throwaway `AGENT_RUNTIME=fake` docker
# compose stack inside the runner (postgres/kernel/caddy, plus a one-off llm-proxy build to
# generate models.json) and runs a browser against it — a materially different, materially
# slower job than ci.yml's three (lint/typecheck/build/test/guards, no Docker, no browser). Not
# wired into ci.yml's own required-checks set; see this file's own final comment for how to
# promote it once it has proven non-flaky.
#
# What this starts, and why only three long-running services: docs/runbooks/web-console.md's own
# "CI（Playwright）" section (short version: AGENT_RUNTIME=fake makes the kernel answer chat
# turns entirely in-process — packages/kernel/src/application/host-bridge/fake-runtime.ts — so
# none of agent-host/worker-supervisor/docker-socket-proxy/egress-proxy, and no docker-in-docker
# for resident containers, is needed for the login/chat/approvals/governance paths this suite
# exercises). W6 added `scripts/accept_s1.sh --lite` at the end of the job — the S1 acceptance
# script's container-free subset, reusing this very stack (see that step's own comment). W7 made
# every e2e spec run for real (a second principal plus two seeded ActionRequests unlock
# approvals.spec.ts) and gave CI one Playwright retry with the report always uploaded — the
# state this workflow is meant to be promoted to a required check in (final comment below).
#
# Keep the workflow name (`e2e`) and job name (`web-e2e`) byte-stable, and never add a `paths` /
# `paths-ignore` filter: a required check that does not report on a PR (docs-only or otherwise)
# blocks that PR from merging — this job is cheap enough (~2.5 min) to run unconditionally.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pin as ci.yml's own "Setup pnpm and Node 22" step — pnpm/action-setup does not
      # support pnpm v11+ (root package.json pins packageManager: pnpm@11.25.0).
      - name: Setup pnpm and Node 22
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @nexttime/web exec playwright install --with-deps chromium

      # --- bring up the stack ------------------------------------------------------------------

      - name: Generate CI .env (deploy/ci/env.ci.template)
        run: |
          set -euo pipefail
          NEXTTIME_DATA="$RUNNER_TEMP/nexttime-data"
          sed "s#__NEXTTIME_DATA__#$NEXTTIME_DATA#" deploy/ci/env.ci.template > .env
          echo "NEXTTIME_DATA=$NEXTTIME_DATA" >>"$GITHUB_ENV"

      # scripts/host-bootstrap.sh / host-env-init.sh / gen-handle-keys.sh are the same,
      # unmodified host scripts every real deployment runs (docs/runbooks/host-bootstrap.md) —
      # `sudo` here only because those scripts deliberately write secrets/*.env and secrets/*.key
      # as 0600/0640, root-owned (by design, not a CI-only choice — see deploy/ci/
      # env.ci.template's own header comment), and every `docker compose` invocation below
      # therefore also runs as root so its CLI-side `env_file:` reads succeed.
      - name: Bootstrap host data directory and secrets
        run: |
          set -euo pipefail
          sudo env "NEXTTIME_DATA=$NEXTTIME_DATA" sh scripts/host-bootstrap.sh
          sudo env "NEXTTIME_DATA=$NEXTTIME_DATA" sh scripts/host-env-init.sh
          sudo env "NEXTTIME_DATA=$NEXTTIME_DATA" sh scripts/gen-handle-keys.sh
          sudo cp config/llm-providers.fake.example.yaml "$NEXTTIME_DATA/config/llm-providers.yaml"
          echo 'FAKE_LLM_API_KEY=fake' | sudo tee -a "$NEXTTIME_DATA/secrets/llm-proxy.env" >/dev/null

      - name: Build kernel/caddy/llm-proxy images
        run: |
          sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml \
            build kernel caddy llm-proxy

      # One-off `docker compose run` (never `up`) — llm-proxy is otherwise unused by this suite
      # (see this file's header comment); this is the only thing it is built for.
      - name: Generate models.json (fake provider)
        run: |
          set -euo pipefail
          sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml \
            run --rm --no-deps -T llm-proxy node dist/cli/gen-models.js </dev/null \
            | sudo tee "$NEXTTIME_DATA/config/models.json" >/dev/null

      - name: Start postgres
        run: |
          sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml \
            up -d --wait postgres

      # Migrations run against the already-healthy postgres via a throwaway `docker compose run`
      # container — BEFORE the long-lived `kernel` service (next step) is ever created. Order
      # matters here, not just tidiness: `kernel`'s own startup does a synchronous, unguarded
      # `await interruptStaleRunningTurns(...)` before it starts its outbox dispatcher
      # (packages/kernel/src/index.ts `BackgroundServices.start()` — no try/catch around that
      # first await, and `main()`'s own `.catch()` only logs the rejection). Starting `kernel`
      # first, against a not-yet-migrated database, throws `relation "activities" does not exist`
      # from that call and the dispatcher never starts — `send_chat_message` still returns success
      # (the row and the Turn get created), but nothing ever drives the Turn to completion, so
      # every chat hangs at `running` forever. Caught by the first real run of this workflow.
      - name: Run kernel migrations
        run: |
          sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml \
            run --rm --no-deps -T kernel node dist/cli/migrate.js </dev/null

      - name: Start kernel/caddy
        run: |
          sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml \
            up -d --wait kernel caddy

      # caddy has no `healthcheck:` in docker-compose.yml, so `up --wait` above only confirms it
      # is running, not that its reverse proxy to kernel (and its own on-demand TLS issuance) is
      # actually serving — this curl loop is the real readiness gate. `-k`: caddy's leaf is
      # signed by its own internal CA (deploy/caddy/Caddyfile `tls internal`), self-signed by
      # design for this deployment (docs/runbooks/web-console.md).
      - name: Wait for /api/health via caddy
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/api/health || true)
            if [ "$code" = "200" ]; then
              echo "caddy /api/health is up (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "caddy /api/health never returned 200 (last: $code)" >&2
          sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml logs --no-color
          exit 1

      # Same bootstrap.js output shape scripts/accept_s1.sh's own bootstrap_step already parses
      # (`workspace created: <id>` / `API key` on the following line) — see that script for the
      # precedent. `set +e`/`set -e` around the capture (rather than letting `set -e` abort mid-
      # substitution) so a failure here prints the actual captured output before exiting, instead
      # of silently swallowing it.
      - name: Bootstrap a workspace and owner API key
        run: |
          set -euo pipefail
          set +e
          out=$(sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml \
            run --rm --no-deps -T kernel node dist/cli/bootstrap.js create-workspace --name ci-e2e --owner owner </dev/null 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "create-workspace exited $rc:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          workspace_id=$(printf '%s\n' "$out" | sed -n 's/^workspace created: //p')
          owner_id=$(printf '%s\n' "$out" | sed -n 's/^owner principal: *//p')
          api_key=$(printf '%s\n' "$out" | awk '/^API key/{getline; print; exit}')
          if [ -z "$workspace_id" ] || [ -z "$owner_id" ] || [ -z "$api_key" ]; then
            echo "could not parse create-workspace output:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          echo "::add-mask::$api_key"
          echo "WEB_E2E_API_KEY=$api_key" >>"$GITHUB_ENV"
          echo "WEB_E2E_BASE_URL=https://127.0.0.1:8443" >>"$GITHUB_ENV"
          echo "E2E_WORKSPACE_ID=$workspace_id" >>"$GITHUB_ENV"
          echo "E2E_OWNER_PRINCIPAL_ID=$owner_id" >>"$GITHUB_ENV"
          echo "bootstrapped workspace $workspace_id (owner $owner_id)"

      # W7: approvals.spec.ts's holder-isolation scenario needs a second principal of role
      # `operator` (`list_pending`/`approve` are `minRole:'operator'`) — the same `add-principal`
      # subcommand scripts/accept_s2.sh's bootstrap_step uses for "bob". Output shape:
      # `principal created: <id>` / `API key` on the following line.
      - name: Add a second principal (operator) for approvals.spec.ts
        run: |
          set -euo pipefail
          set +e
          out=$(sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml \
            run --rm --no-deps -T kernel node dist/cli/bootstrap.js add-principal --workspace "$E2E_WORKSPACE_ID" --name bob --role operator </dev/null 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "add-principal exited $rc:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          principal_id_b=$(printf '%s\n' "$out" | sed -n 's/^principal created: //p')
          api_key_b=$(printf '%s\n' "$out" | awk '/^API key/{getline; print; exit}')
          if [ -z "$principal_id_b" ] || [ -z "$api_key_b" ]; then
            echo "could not parse add-principal output:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          echo "::add-mask::$api_key_b"
          echo "WEB_E2E_API_KEY_B=$api_key_b" >>"$GITHUB_ENV"
          echo "WEB_E2E_PRINCIPAL_ID_B=$principal_id_b" >>"$GITHUB_ENV"
          echo "added operator principal $principal_id_b"

      # W7: seed the two pending ActionRequests approvals.spec.ts expects (one per
      # `resource_scope` marker that file hardcodes) — the exact psql block packages/web/README.md
      # "Seeding a pending ActionRequest" documents for a local run, executed here inside the
      # already-running postgres container. The `outbox` row is what makes the kernel's linkage
      # consumer (already up, previous steps) write the `system.action_pending` chat card and push
      # `action.pending`, exactly as a real `request_action` would. SQL goes in on stdin, never via
      # `-c`: psql only performs `:'var'` interpolation and `\gset` on input it parses itself (the
      # same finding scripts/accept_s2.sh's leak check records).
      - name: Seed two pending ActionRequests (approvals.spec.ts)
        run: |
          set -euo pipefail
          for scope in e2e-approve-flow e2e-isolation-flow; do
            sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml \
              exec -T postgres psql -U nexttime -d nexttime -v ON_ERROR_STOP=1 \
              -v workspace_id="$E2E_WORKSPACE_ID" -v on_behalf_of="$E2E_OWNER_PRINCIPAL_ID" \
              -v resource_scope="$scope" <<'SQL'
          insert into objects (workspace_id, object_type, properties)
          values (:'workspace_id'::uuid, 'Gatekeeper', '{"name":"e2e-test-gate"}'::jsonb)
          returning id as gatekeeper_id \gset

          insert into action_requests
            (workspace_id, status, gatekeeper_id, action_kind, resource_scope, blast_radius,
             policy_decision, await_decision, on_behalf_of, actor_runtime, params)
          values
            (:'workspace_id'::uuid, 'pending_approval', :'gatekeeper_id'::uuid, 'e2e.approval_card_test',
             :'resource_scope', 'medium', 'require_approval', true, :'on_behalf_of'::uuid, 'worker',
             '{}'::jsonb)
          returning id as action_request_id \gset

          insert into outbox (workspace_id, event_type, payload)
          values (
            :'workspace_id'::uuid,
            'ActionRequestPending',
            jsonb_build_object(
              'type', 'ActionRequestPending',
              'workspaceId', :'workspace_id',
              'actionRequestId', :'action_request_id',
              'gatekeeperId', :'gatekeeper_id',
              'actionKind', 'e2e.approval_card_test',
              'resourceScope', :'resource_scope',
              'holderPrincipalIds', jsonb_build_array(:'on_behalf_of')
            )
          );

          \echo seeded action_request_id: :action_request_id
          SQL
          done
          echo "WEB_E2E_SEED_ACTION_REQUESTS=1" >>"$GITHUB_ENV"

      # --- the actual e2e suite ----------------------------------------------------------------

      # Runs every file under packages/web/e2e/ for real: chat.spec.ts and governance.spec.ts
      # (WEB_E2E_BASE_URL/WEB_E2E_API_KEY) and, since W7, approvals.spec.ts's two seeded scenarios
      # too (WEB_E2E_API_KEY_B/WEB_E2E_PRINCIPAL_ID_B/WEB_E2E_SEED_ACTION_REQUESTS from the two
      # steps above). playwright.config.ts gives CI one retry per test so a runner hiccup shows up
      # as "flaky" in the uploaded report instead of failing the whole gate.
      - name: Run web e2e
        run: pnpm --filter @nexttime/web e2e

      # S1 lite (W6, STATUS leftover 7): the subset of scripts/accept_s1.sh that needs no entry
      # container — bootstrap, WorkerDefinition v2 via caddy, two chats answered by the kernel's
      # in-process fake runtime, isolation, a second turn, explain — run against the same stack
      # this job already brought up. Plain `docker compose` inside the script resolves to the same
      # project (same directory, same service names); `run`/`exec`/`ps` never recreate anything.
      # `sudo` for the same reason every compose call above uses it (root-owned secrets/*.env).
      - name: S1 lite acceptance (scripts/accept_s1.sh --lite)
        run: sudo sh scripts/accept_s1.sh --lite

      # `always()`, not `failure()`: a retried-then-passed ("flaky") test only shows up in the
      # report, never in the job's conclusion — uploading it every time is how a flake stays
      # visible now that this workflow is meant to become a required check.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report/
            packages/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: docker compose logs (on failure)
        if: failure()
        run: sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml logs --no-color

      - name: docker compose down
        if: always()
        run: sudo docker compose -f docker-compose.yml -f deploy/ci/docker-compose.ci.yml down -v

# Promoting to a required check: this workflow is intentionally NOT in the branch protection
# rule's required-status-checks list yet (only ci.yml's quality/test/guards are). There is no
# in-repo file that declares that list — a repository admin adds "e2e / web-e2e" to it from the
# GitHub repo Settings → Branches → branch protection rule for `main`, once this workflow has run
# clean on a handful of PRs.
