name: auto-merge

# Routes dependency-update PRs from dependabot[bot]. There is no version-update config: every
# Dependabot PR comes from GitHub's native "Dependabot security updates" repo setting; routine
# version upgrades are done deliberately in planned waves (docs/convergence-plan-2026-09-25.md
# §6 W7 — 2026-09-25 decision, renovate.json removed, its App had never been installed).
# Patch/minor of a non-pi dependency: enable GitHub's native auto-merge (`gh pr merge --auto
# --merge`) — branch protection's required checks (guards/quality/test, strict) still gate the
# actual merge, this only flips the auto-merge switch. Major bumps, and any pi dependency
# (@earendil-works/* — must go through pi.version + the pi-drift contract, docs/runbooks/
# pi-upgrade.md, not a routine bump): label needs-review, never auto-merge.
#
# `pull_request_target`, not `pull_request`: GitHub gives `pull_request`-triggered workflows a
# read-only GITHUB_TOKEN for PRs opened by Dependabot specifically, regardless of what this
# workflow requests — `pull_request_target` runs with the token permissions declared below
# instead. Safe here because the job never checks out or executes the PR's own code, only calls
# the GitHub API against it by number. Update type comes from dependabot/fetch-metadata's own
# semver/dependency-name outputs.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  dependabot:
    name: dependabot
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure the needs-review label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-review --color FBCA04 \
            --description "Dependabot PR that needs a human before merge (major bump, or a pi dependency)" \
            --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Route on Dependabot's own semver update-type / dependency names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -eu
          echo "update-type: $UPDATE_TYPE"
          echo "dependency-names: $DEP_NAMES"
          needs_review=0
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then needs_review=1; fi
          case "$DEP_NAMES" in
            *earendil-works*) needs_review=1 ;;
          esac
          if [ "$needs_review" = 1 ]; then
            gh pr edit "$PR_URL" --add-label needs-review
            echo "needs-review: major bump or pi dependency, not auto-merging"
          else
            gh pr merge "$PR_URL" --auto --merge
            echo "auto-merge enabled (patch/minor, non-pi) — required checks still gate the actual merge"
          fi
