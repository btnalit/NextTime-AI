name: Scorecard analysis

# OpenSSF Scorecard (docs.scorecard.dev). Publishes to api.scorecard.dev (publish_results: true)
# and uploads SARIF to this repo's code scanning dashboard. Not a required check.
#
# ossf/scorecard-action's own docs impose hard restrictions on this workflow when
# publish_results: true (see its README "Workflow Restrictions") — deviating breaks publishing:
#   - no top-level env/defaults on the workflow
#   - no workflow-level write permissions (permissions: read-all here; the job narrows further)
#   - only the job running ossf/scorecard-action may hold id-token: write
#   - that job: ubuntu-hosted runner, no containers/services, no job-level env/defaults, and its
#     steps must come from an approved list (checkout, scorecard-action, upload-artifact,
#     codeql-action/upload-sarif) — all four are exactly what this job uses.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '9 5 * * 6' # weekly, Saturday, off the hour to avoid GitHub's documented cron pile-up
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed for code scanning upload
      security-events: write
      # Needed for GitHub OIDC token (publish_results: true) — scorecard-action's own docs say
      # only this job may hold id-token: write.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
