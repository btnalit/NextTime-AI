name: CI

# R3 CI (docs/development-tasks.md R3; design doc graph-ai-middle-platform-design.md section
# 7.10 CI purity rule). Three independent jobs: quality (lint/typecheck/build/dependency-cruiser
# purity), test (workspace tests against a real pgvector/pgvector:pg17 service container), and
# guards (secret scanning, internal-IP literals, kernel purity, shell script hygiene).

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm/action-setup does not support pnpm v11+ (root package.json pins
      # packageManager: pnpm@11.25.0) - its own README points to pnpm/setup for v11 and newer,
      # which also installs the Node.js runtime in the same step (replacing actions/setup-node).
      - name: Setup pnpm and Node 22
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Dependency graph purity (dependency-cruiser)
        run: pnpm depcruise

      - name: Contract snapshot drift (S3.7, docs/wire-contract-conventions.md §4)
        run: pnpm contract:check

      - name: Vocabulary guard detector unit tests (S3.7)
        run: node --test scripts/guards/vocabulary.test.mjs

      - name: Vocabulary guard (S3.7, docs/wire-contract-conventions.md §5)
        run: node scripts/guards/vocabulary.mjs

      - name: fake-llm scenario self-test (S2.12; spawns deploy/fake-llm/server.mjs on a local port)
        run: node deploy/accept-s2/fake-llm-scenario-selftest.mjs

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexttime
          POSTGRES_PASSWORD: nexttime
          POSTGRES_DB: nexttime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexttime"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://nexttime:nexttime@localhost:5432/nexttime_test
      # S3.7 (docs/wire-contract-conventions.md §5): belt-and-suspenders alongside
      # packages/kernel/vitest.config.ts's own `test.env` — dispatchCapability's resultSchema
      # self-check stays opt-in (unset in production, dispatch.ts's own module doc comment).
      KERNEL_VALIDATE_RESULTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node 22
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        # --no-bail (must precede -r; pnpm forwards flags placed after the script name straight to
        # the script itself, not to pnpm's own recursive runner): pnpm's default recursive behavior
        # kills every other still-running package's test process the instant any one package fails
        # (ERR_PNPM_RECURSIVE_RUN_FIRST_FAIL) — observed hiding packages/kernel's own DB-gated
        # integration suite mid-run behind an unrelated packages/web failure, so a real kernel
        # regression could equally go unreported whenever some other package fails first. Every
        # package's full result is strictly more informative than fewer, unrelated packages
        # happening to finish first; the job's overall pass/fail (this step's exit code) is
        # unchanged — it still fails if any package does.
        run: pnpm --no-bail -r test

  guards:
    name: guards
    runs-on: ubuntu-latest
    # lane-7 P3 fix: pull-requests: write is needed only by gitleaks-action's own PR-comment
    # step below, not by quality/test — narrowed from the workflow-wide permissions: block
    # (which handed every job write access to PRs) down to just this one job.
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on the PR when it finds a leak
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE: only required for organization accounts, not personal ones
          # (this repo is under a personal account) - see gitleaks/gitleaks-action's README.

      - name: Internal IP literal guard
        # docs/development-tasks.md is excluded because its own R3 and E-task acceptance-
        # criteria prose cites the literal 10.x example address this guard must catch (as an
        # example, not a real internal address); verified no other tracked file matches.
        run: |
          ! grep -rnE '10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+' --exclude-dir=node_modules --exclude-dir=.git --exclude=pnpm-lock.yaml --exclude=development-tasks.md .

      - name: Kernel purity guard
        run: sh scripts/check-kernel-purity.sh

      - name: pi version consistency guard (docs/runbooks/pi-upgrade.md)
        run: sh scripts/check-pi-version-consistency.sh

      - name: Membership capabilities must never enter a Handle-scope ceiling (S3.11)
        run: sh scripts/check-membership-capabilities-not-in-handle-scope.sh

      - name: Shell scripts must be LF and executable
        run: |
          bad=$(git ls-files -s 'scripts/*.sh' | grep -v '^100755 ') || true
          if [ -n "$bad" ]; then
            echo "scripts/*.sh must be executable (mode 100755):" >&2
            echo "$bad" >&2
            exit 1
          fi
          crlf=$(grep -l $'\r' scripts/*.sh) || true
          if [ -n "$crlf" ]; then
            echo "scripts/*.sh must use LF line endings:" >&2
            echo "$crlf" >&2
            exit 1
          fi
