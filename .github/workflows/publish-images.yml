name: publish-images

# S9 D1 (docs/development-tasks.md §5g "D1 设计"): build, push, sign and scan every platform image
# for one release tag, so a host installs / upgrades by pulling (scripts/pull-images.sh) instead
# of building from source — host builds have been cut by npm / registry flakiness on most applies
# since v0.17.0.
#
# Triggers:
#   - workflow_call from release-please.yml, right after release-please cuts a release. A release
#     or tag created with the default GITHUB_TOKEN never triggers other workflows (GitHub Actions
#     rule), so `on: release` / `on: push: tags` would never fire here — the call is the only
#     reliable hook.
#   - workflow_dispatch with an existing tag, to (re)publish a past release.
#
# Image set: the same platform images image-scan.yml scans, plus gate-host (gatekeeper-base).
# Acceptance fixtures (accept-s2-*, fake-llm) are not published — they serve only the
# maintainer's host acceptance and keep building on the host.
#
# Names: ghcr.io/<owner>/nexttime-ai-<service>:<tag> and :sha-<short commit>. No `latest`: a host
# always names the release it wants. Build args match scripts/build-images.sh, so the labels the
# console's "pi 运行时" card reads are the same as a host build's.
#
# Integrity: buildx SBOM + provenance attestations; cosign keyless signature on the pushed digest
# (identity = this workflow in this repository; scripts/pull-images.sh verifies exactly that).
# Trivy scans the pushed image and uploads SARIF (report only, never blocks the release — same
# stance as image-scan.yml).
#
# Public-repo red line: built from a clean checkout of the tag; the build context never contains
# .env / secrets/ / docs/private/ (not in git, and .dockerignore excludes them too).

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kernel
            dockerfile: packages/kernel/Dockerfile
          - service: agent-host
            dockerfile: packages/agent-host/Dockerfile
          - service: worker-supervisor
            dockerfile: packages/worker-supervisor/Dockerfile
          - service: llm-proxy
            dockerfile: packages/llm-proxy/Dockerfile
          - service: egress-proxy
            dockerfile: packages/egress-proxy/Dockerfile
          - service: caddy
            dockerfile: deploy/caddy/Dockerfile
          - service: worker-runtime
            dockerfile: deploy/worker-runtime/Dockerfile
          - service: gatekeeper-docker
            dockerfile: gatekeepers/docker/Dockerfile
          - service: gatekeeper-ragflow
            dockerfile: gatekeepers/ragflow/Dockerfile
          - service: gate-host
            dockerfile: packages/gatekeeper-base/Dockerfile
          - service: collector-host-inventory
            dockerfile: collectors/host-inventory/Dockerfile
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like vX.Y.Z, got '$TAG'"; exit 1 ;;
          esac

      - name: Checkout ${{ inputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Derive names and build args
        id: meta
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          short=$(git rev-parse --short HEAD)
          image="ghcr.io/${owner}/nexttime-ai-${{ matrix.service }}"
          {
            echo "image=${image}"
            echo "tags=${image}:${TAG},${image}:sha-${short}"
            echo "short=${short}"
            echo "pi_version=$(tr -d '[:space:]' <pi.version)"
            echo "ext_version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' packages/platform-extension/package.json | head -n 1)"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          # Same derivation as scripts/build-images.sh. Each Dockerfile consumes only the args it
          # declares (kernel: KERNEL_VERSION; worker-runtime: the three pi labels); the rest are
          # ignored with a build warning.
          build-args: |
            KERNEL_VERSION=${{ inputs.tag }} (${{ steps.meta.outputs.short }})
            PI_VERSION=${{ steps.meta.outputs.pi_version }}
            PLATFORM_EXTENSION_VERSION=${{ steps.meta.outputs.ext_version }}
            BUILT_FROM=${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=publish-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign ${{ matrix.service }} (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan ${{ matrix.service }} with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln

      - name: Upload SARIF (${{ matrix.service }})
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: publish-${{ matrix.service }}

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: echo "${IMAGE}:${TAG} -> ${DIGEST}" >>"$GITHUB_STEP_SUMMARY"
