name: publish-images

# S9 D1 (docs/development-tasks.md §5g "D1 设计"): build, push, sign and scan every platform image
# for one release tag, so a host installs / upgrades by pulling (scripts/pull-images.sh) instead
# of building from source — host builds have been cut by npm / registry flakiness on most applies
# since v0.17.0.
#
# Triggers:
#   - workflow_call from release-please.yml, right after release-please cuts a release. A release
#     or tag created with the default GITHUB_TOKEN never triggers other workflows (GitHub Actions
#     rule), so `on: release` / `on: push: tags` would never fire here — the call is the only
#     reliable hook.
#   - workflow_dispatch with an existing tag, to (re)publish a past release.
#
# Image set: the same platform images image-scan.yml scans, plus gate-host (gatekeeper-base).
# Acceptance fixtures (accept-s2-*, fake-llm) are not published — they serve only the
# maintainer's host acceptance and keep building on the host.
#
# Names: ghcr.io/<owner>/nexttime-ai-<service>:<tag> and :sha-<short commit>. No `latest`: a host
# always names the release it wants. Build args match scripts/build-images.sh, so the labels the
# console's "pi 运行时" card reads are the same as a host build's.
#
# Integrity: buildx SBOM + provenance attestations; cosign keyless signature on the pushed digest
# (identity = this workflow on main in this repository; scripts/pull-images.sh verifies exactly
# that). Trivy scans the pushed image and uploads SARIF (report only, never blocks the release —
# same stance as image-scan.yml).
#
# Two jobs (R-33, 2026-10-02 review). `build-sign` is the only job that can push to GHCR
# (packages: write) and mint the Fulcio identity pull-images.sh trusts (id-token: write); it runs
# only checkout, the build (Docker's buildx / login / build-push actions), and cosign (sigstore's
# installer) — the vendors of the tools it uses. `scan` runs Trivy and the SARIF upload with
# neither permission and no registry credentials (the packages are public), on the digest each
# build-sign leg hands over as an artifact. Before the split, every step of one job — Trivy
# included, with the GITHUB_TOKEN as its registry password — could re-push a release tag and
# keyless-sign it as this workflow. Every action is pinned to a full commit SHA.
#
# Only from main: a run from any other ref would overwrite the release's tags with images whose
# signature pull-images.sh rejects (its identity pins refs/heads/main), so build-sign refuses it.
#
# Public-repo red line: built from a clean checkout of the tag; the build context never contains
# .env / secrets/ / docs/private/ (not in git, and .dockerignore excludes them too).

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-sign:
    name: build-sign (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kernel
            dockerfile: packages/kernel/Dockerfile
          - service: agent-host
            dockerfile: packages/agent-host/Dockerfile
          - service: worker-supervisor
            dockerfile: packages/worker-supervisor/Dockerfile
          - service: llm-proxy
            dockerfile: packages/llm-proxy/Dockerfile
          - service: egress-proxy
            dockerfile: packages/egress-proxy/Dockerfile
          - service: caddy
            dockerfile: deploy/caddy/Dockerfile
          - service: worker-runtime
            dockerfile: deploy/worker-runtime/Dockerfile
          - service: gatekeeper-docker
            dockerfile: gatekeepers/docker/Dockerfile
          - service: gatekeeper-ragflow
            dockerfile: gatekeepers/ragflow/Dockerfile
          - service: gate-host
            dockerfile: packages/gatekeeper-base/Dockerfile
          - service: collector-host-inventory
            dockerfile: collectors/host-inventory/Dockerfile
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag and ref
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like vX.Y.Z, got '$TAG'"; exit 1 ;;
          esac
          # workflow_call: the caller's ref (release-please runs on pushes to main);
          # workflow_dispatch: the ref the run was started from.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publish only from main (this run is on '$GITHUB_REF'); its signatures would not verify on a host"
            exit 1
          fi

      - name: Checkout ${{ inputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Derive names and build args
        id: meta
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          short=$(git rev-parse --short HEAD)
          image="ghcr.io/${owner}/nexttime-ai-${{ matrix.service }}"
          {
            echo "image=${image}"
            echo "tags=${image}:${TAG},${image}:sha-${short}"
            echo "short=${short}"
            echo "rev=$(git rev-parse HEAD)"
            echo "pi_version=$(tr -d '[:space:]' <pi.version)"
            echo "ext_version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' packages/platform-extension/package.json | head -n 1)"
          } >>"$GITHUB_OUTPUT"

      # The builder's own image is the GHCR copy of moby/buildkit by digest (deploy/image-mirrors.json),
      # not Docker Hub's buildx-stable-1: Docker Hub limits anonymous pulls per runner address.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=ghcr.io/btnalit/nexttime-mirror-buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          # SBOM generator: the GHCR copy of docker/buildkit-syft-scanner:stable-1 by digest (the one
          # v0.44.0's attestations name), not the Docker Hub default.
          sbom: generator=ghcr.io/btnalit/nexttime-mirror-buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          tags: ${{ steps.meta.outputs.tags }}
          # Same derivation as scripts/build-images.sh. Each Dockerfile consumes only the args it
          # declares (kernel: KERNEL_VERSION; worker-runtime: the three pi labels); the rest are
          # ignored with a build warning.
          build-args: |
            KERNEL_VERSION=${{ inputs.tag }} (${{ steps.meta.outputs.short }})
            PI_VERSION=${{ steps.meta.outputs.pi_version }}
            PLATFORM_EXTENSION_VERSION=${{ steps.meta.outputs.ext_version }}
            BUILT_FROM=${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.rev }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha,scope=publish-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign ${{ matrix.service }} (keyless, by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Handed to `scan` — signed digests only, written after the signature exists.
      - name: Record the signed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" >"$RUNNER_TEMP/digest/image-ref"

      - name: Upload the signed digest (${{ matrix.service }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.service }}
          path: ${{ runner.temp }}/digest/image-ref
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: echo "${IMAGE}:${TAG} -> ${DIGEST}" >>"$GITHUB_STEP_SUMMARY"

  scan:
    name: scan (${{ matrix.service }})
    needs: build-sign
    # Scan whatever was published, even if another service's leg failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No packages, no id-token: nothing here can push or sign. Trivy pulls the public image
    # anonymously.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The same services as build-sign.
        service:
          - kernel
          - agent-host
          - worker-supervisor
          - llm-proxy
          - egress-proxy
          - caddy
          - worker-runtime
          - gatekeeper-docker
          - gatekeeper-ragflow
          - gate-host
          - collector-host-inventory
    steps:
      # Only so the SARIF upload attributes the results to the tag's commit, as before the split.
      - name: Checkout ${{ inputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download the signed digest (${{ matrix.service }})
        id: download
        # Absent when this service's build-sign leg failed — nothing to scan then.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.service }}
          path: ${{ runner.temp }}/digest

      - name: Read the image reference
        id: ref
        if: steps.download.outcome == 'success'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          ref=$(head -n 1 "$RUNNER_TEMP/digest/image-ref")
          case "$ref" in
            ghcr.io/*/nexttime-ai-"$SERVICE"@sha256:*) ;;
            *) echo "::error::unexpected image reference '$ref'"; exit 1 ;;
          esac
          echo "image_ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Scan ${{ matrix.service }} with Trivy
        if: steps.ref.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image_ref }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln

      - name: Upload SARIF (${{ matrix.service }})
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: publish-${{ matrix.service }}
