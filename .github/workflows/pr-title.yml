name: pr-title

# Lints the PR title against conventional commits (feat/fix/docs/chore/...(scope)!: subject) —
# this repo already writes its commits that way (see `git log`). The repo is squash-only
# (Settings → General: only "Allow squash merging" is on), so the PR title becomes the commit on
# `main` and release-please derives the version bump and CHANGELOG entry from it — a wrong type
# here means a wrong release. See docs/runbooks/automation.md.

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  lint-pr-title:
    name: lint-pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
