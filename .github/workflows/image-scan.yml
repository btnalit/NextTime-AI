name: image-scan

# Weekly (+ manual) Trivy scan of every platform image this repo builds — kernel, agent-host,
# worker-supervisor, llm-proxy, egress-proxy, caddy, worker-runtime, both gatekeepers, and the
# host-inventory collector (docker-compose.yml `build:` entries). Not a required check: this is
# a visibility workflow (results land in the Security tab), not a merge gate — no image build
# ever blocks a PR here. One matrix job per image so a Trivy/build problem in one image never
# hides the other nine: `fail-fast: false` keeps every leg running regardless of a sibling's
# outcome, and `continue-on-error: true` keeps that one leg's failure from painting the whole
# workflow run red.
#
# Each leg builds straight from docker-compose.yml's own `context: ., dockerfile: <path>` (no
# build args needed — verified none of these Dockerfiles declare any) and scans the local image
# with Trivy for OS + npm ("library") vulnerabilities, HIGH/CRITICAL only, uploading SARIF to
# code scanning under a per-image category so the ten results don't overwrite each other.

on:
  schedule:
    - cron: '4 6 * * 1' # weekly, Monday, off the hour to avoid GitHub's documented cron pile-up
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kernel
            dockerfile: packages/kernel/Dockerfile
          - image: agent-host
            dockerfile: packages/agent-host/Dockerfile
          - image: worker-supervisor
            dockerfile: packages/worker-supervisor/Dockerfile
          - image: llm-proxy
            dockerfile: packages/llm-proxy/Dockerfile
          - image: egress-proxy
            dockerfile: packages/egress-proxy/Dockerfile
          - image: caddy
            dockerfile: deploy/caddy/Dockerfile
          - image: worker-runtime
            dockerfile: deploy/worker-runtime/Dockerfile
          - image: gatekeeper-docker
            dockerfile: gatekeepers/docker/Dockerfile
          - image: gatekeeper-ragflow
            dockerfile: gatekeepers/ragflow/Dockerfile
          - image: collector-host-inventory
            dockerfile: collectors/host-inventory/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: nexttime-ai-image-scan/${{ matrix.image }}:scan
          cache-from: type=gha,scope=image-scan-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-scan-${{ matrix.image }}

      - name: Scan ${{ matrix.image }} with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexttime-ai-image-scan/${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln

      - name: Upload SARIF (${{ matrix.image }})
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: image-scan-${{ matrix.image }}
