packages:
  - "packages/*"
  # 接入包 (design doc §7.10/§10.1): gatekeepers/<system>/ ships a small runnable TS package
  # (manifest + binding), not just YAML content — see gatekeepers/docker and gatekeepers/ragflow
  # (S2.5).
  - "gatekeepers/*"
  # 采集器 (design doc §7.8/§10.1): collectors/<name>/ ships a small runnable TS package that
  # observes host-level structural facts and writes them through the ingest capabilities
  # (register_source/submit_observations) — see collectors/host-inventory (S3.3).
  - "collectors/*"
allowBuilds:
  '@biomejs/biome': true
  # Transitive deps of @earendil-works/pi-ai (S1.6, platform-extension devDependency) for
  # provider integrations this repo does not use (Google Generative AI, Bedrock protobuf
  # codegen) — declined rather than trusted, since their build scripts are unnecessary here.
  '@google/genai': false
  # Transitive deps of dockerode (worker-supervisor, S1.5) for its optional SSH transport
  # (connecting to a *remote* Docker daemon over ssh) — this package only ever connects over the
  # local unix socket (docker-client.ts `socketPath`), so ssh2's native crypto acceleration
  # addon (cpu-features) is never exercised; declined rather than trusted, same as the other
  # unused-integration entries in this file.
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
# Security floors for transitive dependencies (v0.50.0 pre-release audit, 2026-10-30). Each key
# only matches the vulnerable range, so the override stops applying once the upstream range moves
# past it and can then be deleted. undici 8 is pinned exactly by @earendil-works/pi-coding-agent
# (1.1.0 through 1.4.0 all pin 8.10.2); the rest are in range of their parents and only need a
# floor so the lockfile cannot fall back. deploy/worker-runtime/pi/package.json carries the same
# undici floor for the worker-runtime image. The pi CLI itself runs an esbuild bundle with its own
# inlined undici 8.10.2, which only an upstream pi release can replace (docs/runbooks/pi-upgrade.md §3).
overrides:
  'undici@>=8.0.0 <8.12.2': ^8.12.2
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'qs@>=6.7.0 <6.16.1': ^6.16.1
  'ip-address@>=10.0.0 <10.7.4': ^10.7.4
  '@hono/node-server@>=2.0.0 <2.1.3': ^2.1.3
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'fast-uri@>=4.0.0 <4.2.3': ^4.2.3
