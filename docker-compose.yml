# Deployment skeleton per docs/graph-ai-middle-platform-design.md §10.2.
# All ${...} placeholders are resolved from .env on the target host (see .env.example);
# real values live in docs/private/ (not tracked). Do not hardcode real hosts/paths/credentials
# here.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: nexttime, POSTGRES_USER: nexttime, POSTGRES_PASSWORD_FILE: /run/secrets/pg_password }
    volumes: ["${NEXTTIME_DATA}/pgdata:/var/lib/postgresql/data"]
    secrets: [pg_password]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexttime"], interval: 10s, retries: 5 }
    restart: unless-stopped
    networks: [control]

  kernel:
    build: { context: ., dockerfile: packages/kernel/Dockerfile }
    env_file: ${NEXTTIME_DATA}/secrets/kernel.env # DB URL、Handle 密钥文件路径；无任何外部凭证（I9）
    secrets: [handle_key] # Handle 签名私钥只进这一个容器：/run/secrets/handle_key
    volumes: ["${NEXTTIME_DATA}/config:/data/config:ro", "${NEXTTIME_DATA}/sessions:/data/sessions:ro"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [control, workers]
    restart: unless-stopped

  agent-host:
    build: { context: ., dockerfile: packages/agent-host/Dockerfile }
    environment: { KERNEL_URL: http://kernel:8080, SUPERVISOR_URL: http://worker-supervisor:8081 }
    networks: [control] # 只到 kernel 与 supervisor；不挂载任何用户目录
    restart: unless-stopped

  worker-supervisor:
    build: { context: ., dockerfile: packages/worker-supervisor/Dockerfile }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "${NEXTTIME_DATA}/workspaces:/data/workspaces", "${NEXTTIME_DATA}/sessions:/data/sessions", "${NEXTTIME_DATA}/config:/data/config:ro"]
    environment: { ALLOWED_IMAGES: "nexttime/worker-runtime:*", WORKER_NETWORK: workers, WORKER_RUNTIME: "${WORKER_RUNTIME:-runc}" }
    networks: [control]
    restart: unless-stopped

  gatekeeper-docker:
    build: { context: ., dockerfile: gatekeepers/docker/Dockerfile }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    networks: [control]
    restart: unless-stopped

  gatekeeper-ragflow:
    build: { context: ., dockerfile: gatekeepers/ragflow/Dockerfile }
    env_file: ${NEXTTIME_DATA}/secrets/gatekeeper-ragflow.env
    networks: [control]
    restart: unless-stopped

  caddy:
    image: caddy:2.10 # pin 具体版本；E8
    ports: ["${KERNEL_BIND_ADDR}:8443:8443"]
    # Static roots: placeholder builds until S1.8 (web) / S3 (explorer) publish the real ones —
    # see docs/runbooks/host-caddy.md for the one-line switch to ./packages/web/dist and
    # ./explorer/dist once those exist. ${NEXTTIME_DATA}/caddy:/data persists the internal CA
    # and issued certs (chowned by scripts/host-env-init.sh).
    volumes: ["./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "./deploy/caddy/placeholder:/srv/web:ro", "./deploy/caddy/explorer-placeholder:/srv/explorer:ro", "${NEXTTIME_DATA}/caddy:/data"]
    depends_on: [kernel]
    networks: [control]
    restart: unless-stopped
    # Runs as the image's default root user: the official caddy:2.10 image declares /config as
    # a second VOLUME (autosave state) that isn't bind-mounted here, and it is root-owned inside
    # the image — a non-root `user:` override here would need that path pre-chowned too (or
    # redirected via XDG_CONFIG_HOME), which needs a custom Dockerfile out of E8's scope. Only
    # /data (TLS private keys) is security-sensitive here, and it is already the pre-chowned,
    # bind-mounted, persisted volume regardless of which user writes to it. Raised in the PR
    # body as a follow-up candidate, not decided unilaterally here.

  llm-proxy:
    build: { context: ., dockerfile: packages/llm-proxy/Dockerfile }
    env_file: ${NEXTTIME_DATA}/secrets/llm-proxy.env # provider keys 只在这里
    volumes: ["${NEXTTIME_DATA}/config/llm-providers.yaml:/data/config/llm-providers.yaml:ro"]
    environment: { KERNEL_URL: http://kernel:8080, HANDLE_PUBLIC_KEY_FILE: /data/config/handle.pub }
    networks: [control, workers]
    restart: unless-stopped

  egress-proxy:
    build: { context: ., dockerfile: packages/egress-proxy/Dockerfile }
    volumes: ["${NEXTTIME_DATA}/config/egress-sources.json:/data/config/egress-sources.json:ro"]
    environment: { KERNEL_URL: http://kernel:8080, NEXTTIME_SUBNET_CONTROL: "${NEXTTIME_SUBNET_CONTROL}", NEXTTIME_SUBNET_WORKERS: "${NEXTTIME_SUBNET_WORKERS}", SOURCE_MAP_FILE: /data/config/egress-sources.json }
    networks: [control, workers]
    restart: unless-stopped

  backup:
    image: postgres:17-alpine # 与 postgres 同大版本
    entrypoint: ["/bin/sh", "/backup.sh"] # 每日 pg_dump + sessions/workspaces/config tar.gz，保留 N 份（S1.12）
    volumes: ["./deploy/backup/backup.sh:/backup.sh:ro", "${NEXTTIME_DATA}:/data"]
    environment: { TZ: "${TZ:-UTC}", BACKUP_TIME: "${BACKUP_TIME:-03:30}", RETENTION: "${BACKUP_RETENTION:-7}", PGHOST: postgres }
    depends_on: { postgres: { condition: service_healthy } }
    secrets: [pg_password]
    networks: [control]
    restart: unless-stopped

networks:
  control: { ipam: { config: [{ subnet: "${NEXTTIME_SUBNET_CONTROL}" }] } }
  workers: { internal: true, ipam: { config: [{ subnet: "${NEXTTIME_SUBNET_WORKERS}" }] } }
secrets:
  pg_password: { file: "${NEXTTIME_DATA}/secrets/pg_password" }
  handle_key: { file: "${NEXTTIME_DATA}/secrets/handle.key" } # scripts/gen-handle-keys.sh；0640 组 10001
