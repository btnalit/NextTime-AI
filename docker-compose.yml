# Deployment skeleton per docs/graph-ai-middle-platform-design.md §10.2.
# All ${...} placeholders are resolved from .env on the target host (see .env.example);
# real values live in docs/private/ (not tracked). Do not hardcode real hosts/paths/credentials
# here.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: nexttime, POSTGRES_USER: nexttime, POSTGRES_PASSWORD_FILE: /run/secrets/pg_password }
    # ${NEXTTIME_DATA:?}: an unset/empty NEXTTIME_DATA would otherwise interpolate to an empty
    # string, mounting the host's own filesystem root's /pgdata — fail the whole `docker compose
    # up` instead (lane-7 P1 fix, this file's own convention below for every other always-on,
    # non-gate service that references it).
    volumes: ["${NEXTTIME_DATA:?}/pgdata:/var/lib/postgresql/data"]
    secrets: [pg_password]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexttime"], interval: 10s, retries: 5 }
    restart: unless-stopped
    networks: [control]

  kernel:
    build: { context: ., dockerfile: packages/kernel/Dockerfile }
    env_file: ${NEXTTIME_DATA:?}/secrets/kernel.env # DB URL、Handle 密钥文件路径；无任何外部凭证（I9）
    # handle_key：Handle 签名私钥，只进这一个容器：/run/secrets/handle_key。internal_token
    # （fix/internal-plane-auth）：内核整个 internal plane（/internal/* + /internal/agent-host）的
    # 共享密钥，默认挂载路径 /run/secrets/internal_token 与 @nexttime/shared 的
    # DEFAULT_INTERNAL_TOKEN_FILE 一致，kernel 与其三个 internal 客户端（agent-host/llm-proxy/
    # egress-proxy，见各自服务块）共享同一份文件；scripts/gen-handle-keys.sh 生成。gate_token
    # （fix/gate-protocol-hardening）：kernel 的 HttpGatekeeperClient 调任何 /gate/* 端点都要带
    # 的共享密钥——与 internal_token 是两个不同的 secret（两个不同的信任边界，见
    # @nexttime/gatekeeper-base 的 gate-token.ts 模块注释），默认挂载路径同样是
    # /run/secrets/gate_token（DEFAULT_GATE_TOKEN_FILE），kernel 侧读取用的 env 是
    # NEXTTIME_GATE_TOKEN_FILE；四个门服务各自的服务块见它们自己的注释。
    secrets: [handle_key, internal_token, gate_token]
    # AGENT_RUNTIME=agent-host 现在是默认值（S1.5 后半：真正的 agent-host 事件桥落地）——仍可在
    # .env 里覆盖回 fake（AGENT_RUNTIME=fake）以跳过整条容器/pi 链路。KERNEL_LLM_URL 是
    # AgentHostRuntime 塞进每个 startTurn 命令里的 llmUrl（packages/kernel/src/index.ts
    # createBackgroundServices 的默认值与此一致，这里显式写出以便一眼看到）。
    # ENTRY_HANDLE_TTL_SECONDS / AGENT_HOST_TURN_ACCEPTED_TIMEOUT_MS 留空用代码内默认值
    # （分别是 86400 与 30000）。SUPERVISOR_URL（S2.7）：internal task/invoke_worker 通过
    # adapters/supervisor-client 调用 worker-supervisor 的 Task 模式 API（POST /task/spawn 等）；
    # 与 agent-host 使用同一个值——kernel 已在 [control, workers] 网络上，能直接到达
    # worker-supervisor:8081。TASK_REAPER_INTERVAL_MS 留空用代码内默认值（30s）。
    # NEXTTIME_SUBNET_WORKERS（fix/internal-plane-auth）：internal-auth 的 Worker 子网拒绝规则——
    # 即使 token 正确，来自这个子网的 internal 请求也 401（Worker 容器绝不应持有这个 token）；与
    # egress-proxy 拿到的是同一个值（networks 块下方 workers 网络的子网）。
    environment:
      {
        AGENT_RUNTIME: "${AGENT_RUNTIME:-agent-host}",
        KERNEL_LLM_URL: http://llm-proxy:8082,
        SUPERVISOR_URL: http://worker-supervisor:8081,
        NEXTTIME_SUBNET_WORKERS: "${NEXTTIME_SUBNET_WORKERS:?}",
      }
    # sessions/ 顶层挂载已在 main 移除（PR #29：worker-supervisor 侧从未用到它，S1.5a 已记录这个
    # 偏离——见 docs/development-tasks.md S1.5a 实现说明"sessions/ 顶层目录本次未使用"）；
    # 这里跟随同一决定，不再补上。
    volumes: ["${NEXTTIME_DATA:?}/config:/data/config:ro"]
    # healthcheck (lane-7 P2 fix): GET /api/health via node's own http client — no curl/wget in
    # the node:24-bookworm-slim runtime image (packages/kernel/Dockerfile). Backs caddy's and
    # agent-host's own `depends_on: kernel: condition: service_healthy` below.
    healthcheck:
      {
        test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"],
        interval: 10s,
        timeout: 5s,
        retries: 5,
        start_period: 10s,
      }
    depends_on: { postgres: { condition: service_healthy } }
    networks: [control, workers]
    restart: unless-stopped
    # Hardening (lane-7 P2 fix): kernel runs as non-root `nexttime` (packages/kernel/Dockerfile,
    # uid 10001) and writes nothing to its own container filesystem at runtime (config is a ro
    # bind mount; secrets are their own tmpfs-backed mounts, unaffected by `read_only`) — only
    # `/tmp` needs to stay writable (Node's own scratch use, e.g. os.tmpdir()).
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # docker-socket-proxy (fix/socket-proxy-and-backup-user): docker.sock itself is bind-mounted
  # only into this service and (fix/gate-docker-socket-proxy, below) `docker-socket-proxy-gate` —
  # agent-host and worker-supervisor reach the Engine API through this HTTP allowlist proxy
  # instead (DOCKER_HOST=tcp://docker-socket-proxy:2375 on the new `dockerapi` internal network).
  # Previous state (superseded): both consumers bind-mounted docker.sock directly, and the comment
  # on agent-host's own mount already flagged this ("`:ro` 不是、也从未是这条边界的权限收窄...真正
  # 的调用面收窄需要 docker-socket-proxy 之类的 allowlist 代理...尚未实现") — this service is that.
  # `gatekeeper-docker` (a third former direct consumer) got its own dedicated second instance
  # instead of a widened grant here — see `docker-socket-proxy-gate`'s own comment below for why.
  #
  # Image: tecnativa/docker-socket-proxy (haproxy.cfg allowlists the Engine API by URL-path
  # prefix + HTTP method — verified by reading the image's actual haproxy.cfg/Dockerfile at the
  # v0.5.0 tag via `gh api repos/Tecnativa/docker-socket-proxy/...`, not assumed from its README
  # alone). `http-request deny unless METH_GET || { env(POST) -m bool }` gates every non-GET
  # method behind POST=1 FIRST; each `/xxx` path prefix then needs its own env flag — see that
  # file's "Access granted/revoked by default" sections for the full list.
  #
  # Endpoint inventory (only what's actually called — read both consumers' source, not "typical"
  # docker-socket-proxy defaults):
  #   worker-supervisor (packages/worker-supervisor/src/docker-client.ts): POST /containers/create
  #     (createAndStart), POST /containers/{id}/start, POST /containers/{id}/stop,
  #     DELETE /containers/{id}?force=true (remove), GET /containers/{id}/json (inspectByName),
  #     GET /containers/json?filters=... (listByLabel), GET /networks?filters=...
  #     (resolveNetworkByComposeLabel), GET /events?filters=... (getContainerEvents —
  #     feat/egress-docker-events: event-driven egress de-registration, docker-events.ts; a
  #     read-only subscription, filtered server-side to type=container and this platform's own
  #     nexttime.role label — see EVENTS below). No image/exec/volume/swarm call anywhere in the
  #     package (grepped for docker.getImage/listImages/pull/getNetwork — none found).
  #   agent-host (packages/agent-host/src/container-io.ts): POST /containers/{id}/attach?
  #     stream=1&stdin=1&stdout=1&stderr=1&hijack=1 only — never create/start/stop/remove (see
  #     that file's own module doc comment: "agent-host 只做 docker attach，不 create/start/stop
  #     容器"). attach is a POST-method endpoint under the /containers prefix, so it needs
  #     CONTAINERS=1 + POST=1 exactly like worker-supervisor's own calls — there is no narrower
  #     "attach-only" flag in this proxy, and the proxy is shared (one instance, both consumers,
  #     per this task's own "a docker-socket-proxy" framing), so agent-host's own effective grant
  #     is the union below, not a narrower attach-only slice; a second proxy instance would not
  #     narrow it further for the same reason (haproxy.cfg's CONTAINERS rule is a bare /containers
  #     prefix match with no method/suffix exclusion once POST=1 is granted).
  #
  # Flags (haproxy.cfg verified line-by-line against the v0.5.0 tag):
  #   CONTAINERS=1, POST=1: covers create/start/stop/remove/inspect/list/attach — every
  #     /containers/* path matches this proxy's CONTAINERS prefix rule once POST=1 lifts the
  #     top-level non-GET gate.
  #   NETWORKS=1: GET /networks (resolveNetworkByComposeLabel — worker-supervisor only).
  #   ALLOW_START=1 / ALLOW_STOP=1: the two lifecycle verbs docker-client.ts actually calls
  #     (start/stop) — kept explicit even though CONTAINERS=1 already covers both (haproxy.cfg
  #     evaluates these narrower rules before the general CONTAINERS rule, but CONTAINERS's own
  #     regex has no suffix exclusion, so it independently allows start/stop too); left on for
  #     documentation/intent, not because they add access CONTAINERS doesn't already grant.
  #   ALLOW_RESTARTS=0 / ALLOW_PAUSE=0 / ALLOW_UNPAUSE=0: docker-client.ts never calls
  #     restart/kill/pause/unpause (only .stop()) — deliberately NOT granted, unlike a "typical"
  #     docker-socket-proxy config that turns these on alongside ALLOW_START/ALLOW_STOP.
  #   IMAGES=0: deliberately NOT granted — no docker.getImage/listImages/pull call in either
  #     package (the resident/task container image is built by `docker compose build
  #     worker-runtime`, never pulled or inspected at runtime).
  #   EVENTS=1 (feat/egress-docker-events, was 0): worker-supervisor now subscribes to GET /events
  #     to de-register a crashed/killed container's egress-source-map entry promptly instead of
  #     waiting for the next periodic reaper tick (docker-events.ts's own module doc comment) — the
  #     reaper stays as the fallback if this can never connect (e.g. EVENTS is reverted to 0 here;
  #     see docs/runbooks/host-worker-runtime.md's rollback note). This grant is GET-only (events
  #     is a read-only subscription, not gated behind POST=1 the way CONTAINERS/NETWORKS are) and
  #     narrowed server-side to type=container + label=nexttime.role — agent-host does not use this
  #     flag at all (its own endpoint inventory above is unchanged).
  #   PING=1 / VERSION=1: image defaults, left as-is (harmless — no container/image/secret
  #     information) — this service's own healthcheck below uses PING.
  #   Everything else (AUTH, BUILD, COMMIT, CONFIGS, DISTRIBUTION, EXEC, GRPC, INFO, NODES,
  #   PLUGINS, SECRETS, SERVICES, SESSION, SWARM, SYSTEM, TASKS, VOLUMES): 0, unused by either
  #   consumer.
  docker-socket-proxy:
    # Exact tag verified via `gh api repos/Tecnativa/docker-socket-proxy/releases` (2026-09-08):
    # v0.5.0 is the current stable release (published 2026-07-27). Docker Hub publishes the tag
    # WITH the `v` prefix (`v0.5.0`; the un-prefixed `0.5.0` does not exist — the first host apply
    # failed with "manifest unknown"). Digest pinned from the target host after `docker pull`
    # (`docker inspect --format '{{index .RepoDigests 0}}'`, 2026-09-08); re-pin the same way when
    # bumping the tag. Image runs haproxy as root by default but needs no capability for :2375.
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      {
        CONTAINERS: "1",
        POST: "1",
        NETWORKS: "1",
        ALLOW_START: "1",
        ALLOW_STOP: "1",
        ALLOW_RESTARTS: "0",
        ALLOW_PAUSE: "0",
        ALLOW_UNPAUSE: "0",
        IMAGES: "0",
        EVENTS: "1",
        PING: "1",
        VERSION: "1",
        EXEC: "0",
        VOLUMES: "0",
        BUILD: "0",
        COMMIT: "0",
        SWARM: "0",
        SYSTEM: "0",
        SECRETS: "0",
        CONFIGS: "0",
        PLUGINS: "0",
        TASKS: "0",
        SERVICES: "0",
        NODES: "0",
        AUTH: "0",
        DISTRIBUTION: "0",
        GRPC: "0",
        INFO: "0",
        SESSION: "0",
      }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    # No group_add/DOCKER_GID: this image's own Dockerfile declares `USER root` (verified against
    # the v0.5.0 tag's source, not assumed) — root's uid (0) already matches docker.sock's own
    # owning uid (`root:docker` — see worker-supervisor's own comment below), so it reads the
    # socket via the file's OWNER permission bits and never needs the supplementary-group
    # membership the non-root (uid 10001) consumers below required.
    networks: [dockerapi]
    healthcheck:
      # PING=1 above keeps /_ping allowlisted for exactly this. UNVERIFIED: whether `wget` exists
      # in this image's userland was not confirmed on a real host (no Docker locally) — busybox
      # wget is near-universal on Alpine-based images (haproxy:3.4.2-alpine's own base), but if
      # this healthcheck shows `unhealthy` on the target host, swap it for whatever's actually
      # present (`nc -z localhost 2375`, or drop the healthcheck and keep the plain `depends_on`
      # ordering below) — see this PR's own host verification steps.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # read_only + tmpfs: the image's docker-entrypoint.sh templates /tmp/haproxy.cfg from a
    # bind-in template at every start (needs /tmp writable), and haproxy itself writes its pidfile
    # to /run/haproxy.pid (needs /run writable) — both verified by reading the image's actual
    # docker-entrypoint.sh / haproxy.cfg at the v0.5.0 tag, not guessed.
    read_only: true
    tmpfs: ["/tmp", "/run"]
    # cap_drop: [ALL] — tolerated (task's own "if the image tolerates it" question, answered by
    # reading the image's Dockerfile/entrypoint/haproxy.cfg source at the v0.5.0 tag, not by
    # running it — no Docker available here): binding :2375 needs no capability (only <1024 needs
    # CAP_NET_BIND_SERVICE, and only for a non-root process — irrelevant here either way); the
    # entrypoint's `ulimit -n 10000` is best-effort (`|| true` — needs CAP_SYS_RESOURCE to actually
    # raise the hard limit, silently skipped otherwise); nothing else in the traced startup path
    # (templating /tmp/haproxy.cfg, reading the pre-built /var/lib/haproxy/server-state, forking
    # haproxy's -W master/worker processes) calls for a capability cap_drop:[ALL] would remove.
    # UNVERIFIED ON A REAL HOST — see this PR's own verification steps for the operator command
    # that confirms this empirically (a container stuck restart-looping is the failure signal).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent-host:
    build: { context: ., dockerfile: packages/agent-host/Dockerfile }
    environment:
      {
        KERNEL_URL: http://kernel:8080,
        SUPERVISOR_URL: http://worker-supervisor:8081,
        KERNEL_LLM_URL: http://llm-proxy:8082,
        DOCKER_HOST: tcp://docker-socket-proxy:2375,
      }
    # internal_token（fix/internal-plane-auth）：kernel-link.ts 需要它给 /internal/agent-host 的
    # WS 握手带 Authorization: Bearer <token>——见 kernel 服务块自己的注释。
    secrets: [internal_token]
    # docker.sock (fix/socket-proxy-and-backup-user): this container no longer bind-mounts
    # /var/run/docker.sock at all — packages/agent-host/src/container-io.ts now attaches over
    # DOCKER_HOST=tcp://docker-socket-proxy:2375 on the `dockerapi` network instead (see that
    # service's own comment for the endpoint inventory and env-flag reasoning). Superseded
    # history: the old `:ro` bind mount's own comment already said "`:ro` 不是、也从未是这条边界的
    # 权限收窄...真正的调用面收窄需要 docker-socket-proxy 之类的 allowlist 代理...尚未实现" — this
    # is that fix. No `volumes:`/`group_add` left on this service at all now (docker.sock was its
    # only mount).
    networks: [control, dockerapi] # 只到 kernel/supervisor/docker-socket-proxy；不挂载任何用户目录
    restart: unless-stopped
    # depends_on (lane-7 P2 fix): agent-host's kernel-link.ts dials kernel's /internal/agent-host
    # WS endpoint on startup — wait for kernel's own healthcheck rather than racing it.
    # docker-socket-proxy (fix/socket-proxy-and-backup-user): wait for the proxy to actually be
    # answering before container-io.ts's first attach() attempt.
    depends_on:
      {
        kernel: { condition: service_healthy },
        docker-socket-proxy: { condition: service_healthy },
      }
    # Hardening (lane-7 P2 fix): agent-host runs as non-root `nexttime` (packages/agent-host/
    # Dockerfile, uid 10001).
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  worker-supervisor:
    build: { context: ., dockerfile: packages/worker-supervisor/Dockerfile }
    # internal_token（fix/runtime-hardening, lane-6 review P1-3）：POST /task/spawn 与全部
    # /resident/* 路由现在都要求这个内部共享密钥（packages/worker-supervisor/src/internal-auth.ts）
    # ——这个服务只在 control 网络（下面 networks 只有 control，从不在 workers 上），但此前任何其他
    # control 网络上的服务都能不带凭证直接调用这两组路由；"trusted caller" 只是约定，监听端本身并不
    # 强制。与 kernel/agent-host 用的是同一份文件（DEFAULT_INTERNAL_TOKEN_FILE，
    # scripts/gen-handle-keys.sh 生成）。调用方（agent-host 的 supervisor-client.ts；kernel 的
    # adapters/supervisor-client，同一批修复内已同步更新）必须带上 Authorization: Bearer <token>，
    # 否则拿到 401。
    secrets: [internal_token]
    # docker.sock (fix/socket-proxy-and-backup-user): this container no longer bind-mounts
    # /var/run/docker.sock at all — packages/worker-supervisor/src/docker-client.ts now talks to
    # the Engine API (still via dockerode, no docker CLI needed in the image) over
    # DOCKER_HOST=tcp://docker-socket-proxy:2375 on the new `dockerapi` network instead (see that
    # service's own comment above for the endpoint inventory and env-flag reasoning). workspaces:
    # rw — this is where per-principal directories get created (I15) and bind-mounted (as HOST
    # paths, via NEXTTIME_DATA below) into spawned containers. config: ro for models.json's
    # bind-mount source and general config visibility, EXCEPT egress-sources.json — that single
    # file is re-mounted read-write on top so this service can register/unregister spawned
    # containers' IPs with @nexttime/egress-proxy's SOURCE_MAP_FILE (S1.5a task brief: that
    # package exposes no admin registration endpoint — verified reading
    # packages/egress-proxy/src/admin.ts — so the documented file-based contract is the only
    # integration point; see packages/worker-supervisor/src/egress-map.ts).
    # group_add/DOCKER_GID removed (fix/socket-proxy-and-backup-user): this service no longer
    # touches docker.sock's file permissions at all — the EACCES crash-loop `group_add` used to
    # guard against (docs/runbooks/host-worker-runtime.md "已知偏离") cannot recur, since the
    # bind mount is gone. Historical note: at the time this paragraph was written, `DOCKER_GID`
    # itself was deliberately kept in .env.example/compose because `gatekeeper-docker` (below)
    # still bind-mounted docker.sock directly and needed it — fix/gate-docker-socket-proxy has
    # since closed that too (see `gatekeeper-docker`'s own block below), so no compose service
    # reads `DOCKER_GID` any more; `.env.example`'s own placeholder documents this.
    volumes:
      [
        "${NEXTTIME_DATA:?}/workspaces:/data/workspaces",
        "${NEXTTIME_DATA:?}/config:/data/config:ro",
        "${NEXTTIME_DATA:?}/config/egress-sources.json:/data/config/egress-sources.json",
      ]
    # NEXTTIME_DATA here is the HOST path (not this container's own /data/workspaces mount) —
    # required to compute bind-mount *sources* for the containers this service asks the Docker
    # daemon to create: the daemon resolves those against the host filesystem, not this
    # container's mount namespace (packages/worker-supervisor/src/config.ts doc comment).
    # KERNEL_URL/KERNEL_LLM_URL/HTTP_PROXY_FOR_WORKERS are this service's own defaults for a
    # `/resident/spawn` request that omits `kernelUrl`/`llmUrl`, and the fixed value every
    # spawned container's HTTP(S)_PROXY gets. NETWORK_WORKERS is left unset here — the actual
    # Compose-prefixed network name is resolved at startup from the `com.docker.compose.network`
    # label Compose stamps on the `workers` network (docker-client.ts
    # `resolveNetworkByComposeLabel`); set it explicitly only if that resolution ever needs a
    # manual override.
    # TASK_MAX_RUNTIME_SEC/TASK_WORKDIR_RETENTION_HOURS/TASK_REAP_INTERVAL_MS (S2.8, one-shot Task
    # mode): all already have safe built-in defaults (packages/worker-supervisor/src/config.ts) —
    # passed through here, like WORKER_RUNTIME above, only so an operator can override them via
    # `.env` without editing this file. TASK_REAP_INTERVAL_MS (fix/runtime-hardening, lane-6 review
    # P2-7): default lowered from a fixed 30s to a configurable 10s — bounds how stale an exited
    # Task container's egress-map registration can get before a Docker-assigned IP reuse could
    # misattribute a different container's egress to it; see config.ts's own doc comment.
    environment:
      {
        WORKER_IMAGE: nexttime-ai-worker-runtime,
        WORKER_RUNTIME: "${WORKER_RUNTIME:-runc}",
        NEXTTIME_DATA: "${NEXTTIME_DATA:?}",
        KERNEL_URL: http://kernel:8080,
        KERNEL_LLM_URL: http://llm-proxy:8082,
        HTTP_PROXY_FOR_WORKERS: http://egress-proxy:3128,
        TASK_MAX_RUNTIME_SEC: "${TASK_MAX_RUNTIME_SEC:-3600}",
        TASK_WORKDIR_RETENTION_HOURS: "${TASK_WORKDIR_RETENTION_HOURS:-72}",
        TASK_REAP_INTERVAL_MS: "${TASK_REAP_INTERVAL_MS:-10000}",
        DOCKER_HOST: tcp://docker-socket-proxy:2375,
      }
    networks: [control, dockerapi]
    restart: unless-stopped
    # docker-socket-proxy (fix/socket-proxy-and-backup-user): resident/task reconcile on startup
    # (index.ts's `residentService.reconcile()`/`taskService.reconcile()`) both call the Docker
    # client immediately — wait for the proxy to actually be answering first.
    depends_on: { docker-socket-proxy: { condition: service_healthy } }
    # Hardening (lane-7 P2 fix): runs as non-root `nexttime` (packages/worker-supervisor/
    # Dockerfile, uid 10001); the two workspaces/config mounts above are external bind mounts
    # (unaffected by `read_only`) — only /tmp needs to stay writable.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # build-only: exists so `docker compose build worker-runtime` produces the
  # `nexttime-ai-worker-runtime` image worker-supervisor's resident mode spawns by name (its
  # `WORKER_IMAGE` env above) — this service itself is never `up` (deploy/worker-runtime/
  # Dockerfile; docs/runbooks/host-worker-runtime.md has the build/spawn walkthrough).
  worker-runtime:
    build: { context: ., dockerfile: deploy/worker-runtime/Dockerfile }
    image: nexttime-ai-worker-runtime
    profiles: ["build-only"]

  # docker-socket-proxy-gate (fix/gate-docker-socket-proxy): a SECOND tecnativa/docker-socket-proxy
  # instance, dedicated to `gatekeeper-docker` alone — closes the last direct docker.sock bind
  # mount in this file (agent-host/worker-supervisor already went through `docker-socket-proxy`
  # above). Why a second instance rather than widening the first one's allowlist: the first
  # proxy's allowlist is the union of what agent-host + worker-supervisor need (create/start/stop/
  # remove/attach); granting `ALLOW_RESTARTS` there would widen access for those two unrelated
  # consumers, and granting create/remove to this gate would widen the first proxy the other way —
  # one instance per trust boundary. `dockerapi-gate` (networks: block below) is a disjoint
  # `internal: true` network from `dockerapi` — nothing on one can reach the proxy on the other.
  #
  # Endpoint inventory (read gatekeepers/docker/src/docker-client.ts + transport.ts — every
  # Docker API path+method the gate's own dockerode client actually calls, driven by every
  # Operation manifest.json publishes, not "typical" gate defaults):
  #   containers.list / compose.ls / compose.up's and compose.down's own pre-listing: GET
  #     /containers/json (`listContainers`, optionally `?filters=...` for the compose-project
  #     label).
  #   container.inspect / container.restart's post-restart re-inspect / its own `simulate`: GET
  #     /containers/{id}/json (`inspectContainer`).
  #   container.logs_tail: GET /containers/{id}/logs (`logsTail`).
  #   container.restart: POST /containers/{id}/restart (`restart`).
  #   compose.up: POST /containers/{id}/start for each already-stopped container in the named
  #     project (`start`).
  #   compose.down: POST /containers/{id}/stop for each running container in the named project
  #     (`stop`).
  #   health() (this service's own healthcheck target below, and the gate's own `/gate/health`):
  #     GET /_ping (`ping`).
  #   No /images, /networks, /info, /version, /events, or /exec call anywhere in
  #   gatekeepers/docker/src (grepped for docker.getImage/listImages/pull/getEvents/getNetwork/
  #   exec — none found; unlike worker-supervisor, this gate never resolves a network).
  #
  # Flags (haproxy.cfg semantics as verified on the `docker-socket-proxy` service above — same
  # v0.5.0 tag/image, same "CONTAINERS's own regex has no suffix exclusion" behavior):
  #   CONTAINERS=1, POST=1: covers list/inspect/logs/restart/start/stop — every /containers/* path
  #     this gate calls.
  #   ALLOW_RESTARTS=1: `container.restart` (POST /containers/{id}/restart) — the one verb the
  #     other proxy instance above deliberately does NOT grant.
  #   ALLOW_START=1 / ALLOW_STOP=1: `compose.up`/`compose.down` call dockerode's `start()`/`stop()`
  #     on already-existing containers (gatekeepers/docker/README.md "compose.up/compose.down —
  #     reduced semantics") — this gate's own operations do include them, so both are granted
  #     here (not left at 0).
  #   ALLOW_PAUSE=0 / ALLOW_UNPAUSE=0: never called.
  #   NETWORKS=0: never called (unlike worker-supervisor, this gate never resolves a network by
  #     Compose label).
  #   IMAGES=0: never called (no image list/pull/inspect anywhere in this gate).
  #   EVENTS=0: explicit override — same reasoning as the other proxy instance (image default is
  #     1; nothing here subscribes to the event stream).
  #   PING=1 / VERSION=1: image defaults, left as-is (harmless) — this service's own healthcheck
  #     below uses PING.
  #   Everything else (AUTH, BUILD, COMMIT, CONFIGS, DISTRIBUTION, EXEC, GRPC, INFO, NODES,
  #   PLUGINS, SECRETS, SERVICES, SESSION, SWARM, SYSTEM, TASKS, VOLUMES): 0, unused.
  docker-socket-proxy-gate:
    # Same tag/digest as `docker-socket-proxy` above — see that service's own comment for how it
    # was verified (`gh api repos/Tecnativa/docker-socket-proxy/releases`; digest pinned from a
    # `docker pull` on the target host). Re-pin the same way when bumping the tag.
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      {
        CONTAINERS: "1",
        POST: "1",
        ALLOW_RESTARTS: "1",
        ALLOW_START: "1",
        ALLOW_STOP: "1",
        ALLOW_PAUSE: "0",
        ALLOW_UNPAUSE: "0",
        NETWORKS: "0",
        IMAGES: "0",
        EVENTS: "0",
        PING: "1",
        VERSION: "1",
        EXEC: "0",
        VOLUMES: "0",
        BUILD: "0",
        COMMIT: "0",
        SWARM: "0",
        SYSTEM: "0",
        SECRETS: "0",
        CONFIGS: "0",
        PLUGINS: "0",
        TASKS: "0",
        SERVICES: "0",
        NODES: "0",
        AUTH: "0",
        DISTRIBUTION: "0",
        GRPC: "0",
        INFO: "0",
        SESSION: "0",
      }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    # No group_add/DOCKER_GID: same reasoning as `docker-socket-proxy` above — this image's own
    # Dockerfile runs the proxy as root, which already owns docker.sock's OWNER permission bits.
    networks: [dockerapi-gate]
    healthcheck:
      # Same UNVERIFIED-on-a-real-host caveat as `docker-socket-proxy` above (no Docker locally to
      # confirm `wget` exists in this image's userland) — see this PR's own host verification
      # steps; swap for `nc -z localhost 2375` if this shows `unhealthy` on the target host.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # read_only/tmpfs/cap_drop/security_opt: same reasoning as `docker-socket-proxy` above (same
    # image, same entrypoint/haproxy startup path — UNVERIFIED ON A REAL HOST, same caveat).
    read_only: true
    tmpfs: ["/tmp", "/run"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # gatekeeper-docker (fix/gate-docker-socket-proxy): talks to the host's own Docker Engine API via
  # dockerode (gatekeepers/docker — no docker CLI in the image), now over `docker-socket-proxy-
  # gate` on the `dockerapi-gate` network instead of a direct `/var/run/docker.sock` bind mount —
  # this was the last direct docker.sock consumer in this file (agent-host/worker-supervisor
  # already went through their own `docker-socket-proxy` instance above). No `volumes:`/
  # `group_add`/`DOCKER_GID` left on this service at all now (docker.sock was its only mount, same
  # cutover shape as agent-host/worker-supervisor's own fix/socket-proxy-and-backup-user). Runs as
  # non-root uid 10001 (gatekeepers/docker/Dockerfile, same pattern as worker-supervisor/
  # agent-host) — no longer needs the host's docker group gid as a supplementary group, since it
  # never touches the socket's file permissions at all. GATE_DATA_DIR only holds the idempotency
  # store (no ConnectedAccount store — this gate uses no per-user credential, see
  # gatekeepers/docker/README.md). gate_token（fix/gate-protocol-hardening）：every /gate/* route
  # now requires it (Authorization: Bearer <token>) — default mount path /run/secrets/gate_token
  # matches GATE_KERNEL_TOKEN_FILE's own default; this gate refuses to start without it
  # (gate-auth.ts).
  gatekeeper-docker:
    build: { context: ., dockerfile: gatekeepers/docker/Dockerfile }
    secrets: [gate_token]
    environment: { DOCKER_HOST: tcp://docker-socket-proxy-gate:2375 }
    volumes: ["${NEXTTIME_DATA}/gatekeepers/docker:/data/gate"]
    networks: [control, dockerapi-gate]
    # docker-socket-proxy-gate (fix/gate-docker-socket-proxy): wait for the proxy to actually be
    # answering before this gate's first Engine API call (same ordering `agent-host`/
    # `worker-supervisor` already apply against `docker-socket-proxy` above).
    depends_on: { docker-socket-proxy-gate: { condition: service_healthy } }
    restart: unless-stopped

  # gatekeeper-ragflow: http-kind gate for a RAGFlow instance's REST API (gatekeepers/ragflow).
  # RAGFLOW_BASE_URL / GATE_CREDENTIAL_RAGFLOW_API_KEY come from the env_file below — never
  # hardcoded here (§11 "凭证不进内核进程", same rule applied to this gate's own compose service).
  # gate_token：见 gatekeeper-docker 服务块自己的注释。
  gatekeeper-ragflow:
    build: { context: ., dockerfile: gatekeepers/ragflow/Dockerfile }
    env_file: ${NEXTTIME_DATA}/secrets/gatekeeper-ragflow.env
    secrets: [gate_token]
    volumes: ["${NEXTTIME_DATA}/gatekeepers/ragflow:/data/gate"]
    networks: [control]
    restart: unless-stopped

  # docker-socket-proxy-collector (S3.3, docs/development-tasks.md S3.3): a THIRD
  # tecnativa/docker-socket-proxy instance, dedicated to collector-host-inventory alone — same
  # "one instance per trust boundary" reasoning docker-socket-proxy-gate's own comment above gives
  # (never widen an existing consumer's allowlist for a new, unrelated one). `dockerapi-collector`
  # (networks: block below) is a disjoint `internal: true` network from `dockerapi`/`dockerapi-gate`
  # — nothing on this network can reach either other proxy instance.
  #
  # Endpoint inventory (collectors/host-inventory/src/docker-client.ts — every Docker API path this
  # collector's own dockerode client calls, driven by that module's own `DockerClient` interface,
  # not "typical" defaults): GET /info (`info`), GET /containers/json (`listContainers`), GET
  # /images/json (`listImages`), GET /networks (`listNetworks`), GET /volumes (`listVolumes`), GET
  # /_ping (`ping`, also this service's own healthcheck target below). No POST anywhere in this
  # package — no restart/start/stop/exec, matching S3.3's own "批准：否（只读）" acceptance.
  #
  # Flags (same v0.5.0 image/digest as the other two proxy instances — haproxy.cfg semantics
  # already verified there):
  #   CONTAINERS=1, IMAGES=1, NETWORKS=1, VOLUMES=1, INFO=1: covers every GET path above.
  #   POST=0: no write verb granted at all — the one thing that most distinguishes this proxy
  #     instance from both of its siblings, each of which grants at least one.
  #   PING=1 / VERSION=1: image defaults, left as-is (harmless) — PING backs this service's own
  #     healthcheck below.
  #   Everything else (AUTH, BUILD, COMMIT, CONFIGS, DISTRIBUTION, EVENTS, EXEC, GRPC, NODES,
  #   PLUGINS, SECRETS, SERVICES, SESSION, SWARM, SYSTEM, TASKS, ALLOW_*): 0, unused.
  docker-socket-proxy-collector:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      {
        CONTAINERS: "1",
        IMAGES: "1",
        NETWORKS: "1",
        VOLUMES: "1",
        INFO: "1",
        POST: "0",
        PING: "1",
        VERSION: "1",
        ALLOW_RESTARTS: "0",
        ALLOW_START: "0",
        ALLOW_STOP: "0",
        ALLOW_PAUSE: "0",
        ALLOW_UNPAUSE: "0",
        EXEC: "0",
        BUILD: "0",
        COMMIT: "0",
        SWARM: "0",
        SYSTEM: "0",
        SECRETS: "0",
        CONFIGS: "0",
        PLUGINS: "0",
        TASKS: "0",
        SERVICES: "0",
        NODES: "0",
        AUTH: "0",
        DISTRIBUTION: "0",
        GRPC: "0",
        SESSION: "0",
        EVENTS: "0",
      }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    # No group_add/DOCKER_GID: same reasoning as the other two proxy instances — this image's own
    # entrypoint runs as root, which already owns docker.sock's OWNER permission bits.
    networks: [dockerapi-collector]
    healthcheck:
      # Same UNVERIFIED-on-a-real-host caveat as the other two proxy instances (no Docker locally
      # to confirm `wget` exists in this image's userland).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp", "/run"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # collector-host-inventory (S3.3): the structural host-inventory collector
  # (collectors/host-inventory) — dockerode (over docker-socket-proxy-collector, never a direct
  # docker.sock mount) + systemctl + git remote + a bounded process tree, writing through the
  # kernel's register_source/submit_observations capabilities. Read-only against the host it
  # observes; the one thing it *writes* is graph data in the kernel it is not itself trusted to
  # approve — no approval gate applies to it (S3.3's own acceptance: "批准：否（只读）").
  #
  # collector_host_inventory_token (docs/runbooks/host-collector.md): this collector's own scoped
  # Handle bearer token, minted once by `bootstrap.js issue-service-handle` (operator step, not
  # generated by this compose file) and placed at ${NEXTTIME_DATA}/secrets/collector-host-
  # inventory.token — a *different* secret from every other one in this file (gate_token/
  # internal_token/handle_key), following the same "one secret per trust boundary" rule.
  #
  # /run/systemd:ro (optional — collectors/host-inventory/src/systemd.ts's own doc comment):
  # mounted directly from the host's own runtime path (same convention docker.sock itself uses
  # above — not something ${NEXTTIME_DATA} manages, since it is the *host OS's* own systemd runtime
  # directory, not this platform's persisted data). Omitting this mount is a supported
  # configuration — systemd.ts checks for its presence and skips cleanly when absent, exactly the
  # acceptance criterion's own "skip if not visible" path.
  #
  # No `pid: host` — collectors/host-inventory/src/process-tree.ts's own doc comment has the full
  # reasoning (a real, undocumented privilege escalation this task's own compose section never
  # asked for; the "skip if not visible" acceptance path is this collector's expected default
  # behavior without it, not a rare failure mode).
  collector-host-inventory:
    build: { context: ., dockerfile: collectors/host-inventory/Dockerfile }
    secrets: [collector_host_inventory_token]
    environment:
      {
        KERNEL_URL: http://kernel:8080,
        NEXTTIME_HANDLE_TOKEN_FILE: /run/secrets/collector_host_inventory_token,
        DOCKER_HOST: tcp://docker-socket-proxy-collector:2375,
        HOST_INVENTORY_INTERVAL_MS: "${HOST_INVENTORY_INTERVAL_MS:-900000}",
      }
    volumes:
      [
        "${NEXTTIME_DATA}/collectors/host-inventory:/data/state",
        "/run/systemd:/run/systemd:ro",
      ]
    networks: [control, dockerapi-collector]
    depends_on:
      {
        kernel: { condition: service_healthy },
        docker-socket-proxy-collector: { condition: service_healthy },
      }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    build: { context: ., dockerfile: deploy/caddy/Dockerfile } # caddy:2.10 + 内建 web 静态产物（E8 + S1.8）
    image: nexttime-ai-caddy
    # ${KERNEL_BIND_ADDR:?}: unset/empty would otherwise interpolate to "" and Compose defaults
    # the missing host part to 0.0.0.0 — exposing the HTTPS entrypoint on every interface instead
    # of the intended bind address (lane-7 P1 fix).
    ports: ["${KERNEL_BIND_ADDR:?}:8443:8443"]
    # Static roots ship inside the image: deploy/caddy/Dockerfile builds packages/web and copies
    # dist/ to /srv/web (/srv/explorer holds the S3.5 Explorer bundle once a host operator has
    # run `sh explorer/build.sh` — a placeholder page until then, see explorer/README.md).
    # Rebuild the image to deploy a web change. ${NEXTTIME_DATA:?}/caddy:/data persists the
    # internal CA and issued certs (chowned by scripts/host-env-init.sh).
    volumes: ["./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "${NEXTTIME_DATA:?}/caddy:/data"]
    # S3.5 (docs/development-tasks.md §S3.5): EXPLORER_API_KEY — the API key of a Principal the
    # Explorer static bundle's requests are attributed to (Caddyfile's own comment on why: the
    # unmodified bundle sends no X-API-Key itself). Not `env_file` (llm-proxy's own
    # `${NEXTTIME_DATA}/secrets/llm-proxy.env` pattern) deliberately — `env_file` requires the
    # referenced file to already exist at `docker compose up` time, which broke this workflow's own
    # CI e2e job (it provisions secrets only for the services it actually starts, and does not know
    # about this one — caught on the first PR push, see that job's run history). `${VAR:-}` compose-
    # level substitution has no such file dependency: unset defaults to an empty string, which the
    # Caddyfile's `{$EXPLORER_API_KEY}` placeholder then substitutes into an equally empty
    # `X-API-Key` header, which the kernel's own auth 401s (fails closed, not silently
    # unauthenticated) — a real deployment sets `EXPLORER_API_KEY` in `.env` (see
    # docs/runbooks/host-explorer.md); this file's own credential-handling convention otherwise
    # keeps *provider*/database/token secrets out of `.env` (`.env.example`'s own comment) — a
    # platform-issued API key for one dedicated, least-privileged Principal is a smaller-consequence
    # exception, already visible in the same category `KERNEL_PUBLIC_URL`/`NEXTTIME_SUBNET_*` sit in.
    # TRUST BOUNDARY: this one key is injected by caddy into EVERY request reaching the Explorer
    # endpoints — anyone who can reach :8443 reads the graph as that Principal, unauthenticated,
    # and audit attributes to it, not to the viewer. Leave empty (default → 401) unless :8443 is
    # LAN/VPN-only, and then use a dedicated `auditor`-role Principal's key, never an owner's.
    # See docs/runbooks/host-explorer.md "信任边界".
    environment: { EXPLORER_API_KEY: "${EXPLORER_API_KEY:-}" }
    depends_on: { kernel: { condition: service_healthy } }
    networks: [control]
    restart: unless-stopped
    # Runs as the image's default root user: the official caddy:2.10 image declares /config as
    # a second VOLUME (autosave state) that isn't bind-mounted here, and it is root-owned inside
    # the image — a non-root `user:` override here would need that path pre-chowned too (or
    # redirected via XDG_CONFIG_HOME), which needs a custom Dockerfile out of E8's scope. Only
    # /data (TLS private keys) is security-sensitive here, and it is already the pre-chowned,
    # bind-mounted, persisted volume regardless of which user writes to it. Raised in the PR
    # body as a follow-up candidate, not decided unilaterally here.

  llm-proxy:
    build: { context: ., dockerfile: packages/llm-proxy/Dockerfile }
    env_file: ${NEXTTIME_DATA:?}/secrets/llm-proxy.env # provider keys 只在这里
    volumes: ["${NEXTTIME_DATA:?}/config/llm-providers.yaml:/data/config/llm-providers.yaml:ro", "${NEXTTIME_DATA:?}/config/handle.pub:/data/config/handle.pub:ro"]
    environment: { KERNEL_URL: http://kernel:8080, HANDLE_PUBLIC_KEY_FILE: /data/config/handle.pub, LLM_PROXY_PORT: 8082 }
    # internal_token（fix/internal-plane-auth）：revocation sync（GET /internal/handle-revocations）
    # 与 usage 上报（POST /internal/llm-usage）都要带它——见 kernel 服务块自己的注释。
    secrets: [internal_token]
    networks: [control, workers]
    restart: unless-stopped
    # Hardening (lane-7 P2 fix): runs as non-root `nexttime` (packages/llm-proxy/Dockerfile, uid
    # 10001); config/handle.pub are ro bind mounts — only /tmp needs to stay writable.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  egress-proxy:
    build: { context: ., dockerfile: packages/egress-proxy/Dockerfile }
    volumes: ["${NEXTTIME_DATA:?}/config/egress-sources.json:/data/config/egress-sources.json:ro"]
    # EGRESS_DENY_UNKNOWN_SOURCE（fix/runtime-hardening，lane-6 review P2-7）：默认 fail-closed
    # （代码内默认 true）——一个 SOURCE_MAP_FILE 里完全没有登记的来源 IP 直接 403，不再和"已登记但无
    # allow/deny 限制"的来源一样按公网放行处理。只在 SOURCE_MAP_FILE 登记本身不可靠（worker-
    # supervisor 的 resident-service.ts 记录过的 EACCES 一类主机权限问题）时临时设成 0 作为逃生舱。
    environment: { KERNEL_URL: http://kernel:8080, NEXTTIME_SUBNET_CONTROL: "${NEXTTIME_SUBNET_CONTROL:?}", NEXTTIME_SUBNET_WORKERS: "${NEXTTIME_SUBNET_WORKERS:?}", SOURCE_MAP_FILE: /data/config/egress-sources.json, EGRESS_TRUSTED_RESOLVED_CIDRS: "${EGRESS_TRUSTED_RESOLVED_CIDRS:-}", EGRESS_DENY_HOST_SUFFIXES: "${EGRESS_DENY_HOST_SUFFIXES:-}", EGRESS_DENY_UNKNOWN_SOURCE: "${EGRESS_DENY_UNKNOWN_SOURCE:-1}" }
    # internal_token（fix/internal-plane-auth）：egress 上报（POST /internal/egress）要带它——见
    # kernel 服务块自己的注释。
    secrets: [internal_token]
    networks: [control, workers]
    restart: unless-stopped
    # Hardening (lane-7 P2 fix): runs as non-root `nexttime` (packages/egress-proxy/Dockerfile,
    # uid 10001); the config mount above is ro — only /tmp needs to stay writable.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # 仅测试/验收用（S1.10 accept_s1.sh 与本任务的主机验收）：确定性的 OpenAI 兼容假上游，见
  # deploy/fake-llm/server.mjs 与 config/llm-providers.fake.example.yaml。`profiles: ["test"]`——
  # 默认 `docker compose up` 不会拉起它；换真实 provider只需编辑
  # ${NEXTTIME_DATA}/config/llm-providers.yaml + secrets/llm-proxy.env，不改这个 compose 文件。
  fake-llm:
    build: { context: ., dockerfile: deploy/fake-llm/Dockerfile }
    profiles: ["test"]
    networks: [control]
    restart: unless-stopped

  # accept-s2 (S2.12 acceptance-only fixtures; profiles: ["accept-s2"] — never started by plain
  # `docker compose up`). scripts/accept_s2.sh drives all of these; see
  # docs/runbooks/host-accept-s2.md for the full flow and docs/development-tasks.md S2.12 for the
  # seven acceptance steps these back. All five reuse the existing `control` network rather than a
  # new dedicated one: `application/gateway/connection-handlers.ts`'s `create_connection` fetches
  # `manifestSource` (the OpenAPI document) directly from the *kernel* process, so the openapi
  # fixture must be reachable from `control` regardless; putting the sshd fixture on a separate
  # network while `kernel` (which cannot gain a third network without editing its own already-
  # existing service block, outside this file's additive-only scope) stays off it would not add any
  # real isolation — a spawned Worker container only ever gets the isolated `workers` network
  # (S2.8's spawn spec), so it is exactly as unreachable to every one of these five services as it
  # already is to postgres/kernel/gatekeeper-docker on `control` today. See
  # docs/runbooks/host-accept-s2.md "已知偏离" for the full reasoning.

  # A container-simulated "test SSH host" (S2.12 deliverable 1a). Pubkey-only auth — the private
  # half of the keypair is generated at accept_s2.sh runtime into ${NEXTTIME_DATA}/accept-s2/ssh/
  # and never committed to the repo; see deploy/accept-s2/sshd/Dockerfile's own header comment.
  accept-s2-sshd:
    build: { context: ., dockerfile: deploy/accept-s2/sshd/Dockerfile }
    profiles: ["accept-s2"]
    volumes: ["${NEXTTIME_DATA}/accept-s2/ssh/id_ed25519.pub:/etc/accept-s2/authorized_keys:ro"]
    networks: [control]
    restart: "no"

  # A test OpenAPI service (S2.12 deliverable 1b) — serves both the OpenAPI document
  # `create_connection`'s `manifestSource` imports from and the one real `/stock` operation
  # (bearer-token gated, ACCEPT_S2_API_TOKEN generated at accept_s2.sh runtime — never a value
  # baked into this file). See deploy/accept-s2/openapi-fixture/server.mjs's own header comment.
  # `:-` (not `:?`): compose interpolates every service's `environment:` block for the *whole*
  # file before profile filtering ever runs, so a `:?` default here would make every ordinary
  # `docker compose up/ps/build` on the host (for any service, not just this profile) fail with
  # this message whenever ACCEPT_S2_API_TOKEN happens to be unset in the shell/`.env` — i.e.
  # always, outside of accept_s2.sh's own run. `deploy/accept-s2/openapi-fixture/server.mjs`
  # already refuses to start with an empty/missing token (see that file's own header comment), so
  # an accidental `docker compose --profile accept-s2 up` without the token set fails loudly
  # inside the container instead, not at compose-parse time for every other command.
  accept-s2-openapi:
    build: { context: ., dockerfile: deploy/accept-s2/openapi-fixture/Dockerfile }
    profiles: ["accept-s2"]
    environment: { ACCEPT_S2_API_TOKEN: "${ACCEPT_S2_API_TOKEN:-}" }
    networks: [control]
    restart: "no"

  # A test MCP server (S3.12's own acceptance deliverable — "接入一个 fixture MCP server"). No
  # fronting Gatekeeper process, unlike accept-s2-openapi/accept-s2-http-gate: `create_connection`
  # for `kind:'mcp'` imports directly from `manifestSource` via `McpTransport.listTools`
  # (connection-handlers.ts `resolveManifestOperations`) — the kernel process itself calls this
  # container, no gate in between — and the two fixture tools need no credential, so
  # `scripts/accept_s2.sh`'s connect-mcp-* step uses `credentialKind:'shared'`, which never POSTs
  # a ConnectedAccount credential anywhere (the only thing a fronting gate would be for). See
  # deploy/accept-s2/mcp/server.mjs's own header comment.
  accept-s2-mcp:
    build: { context: ., dockerfile: deploy/accept-s2/mcp/Dockerfile }
    profiles: ["accept-s2"]
    networks: [control]
    restart: "no"

  # Generic ssh-kind Gatekeeper instance — packages/gatekeeper-base's own env-driven main()
  # (docs/runbooks/host-gatekeepers.md's §2/§3 pattern for docker/ragflow, applied directly to the
  # base image here since this connection has no dedicated `gatekeepers/<system>` package; see
  # packages/gatekeeper-base/src/index.ts's own "the common http/cli/ssh single-transport case"
  # main() doc comment). GATE_SSH_POLICY_FILE is deliberately `[]` — every command this gate's own
  # SshTransport runs is therefore "unclassified" by its internal classifyCommand (informational
  # only, packages/gatekeeper-base/src/kinds/ssh.ts — never consulted by kernel governance). S2.12
  # step 4's approval-card / "always allow" behavior is instead driven by this gate's *published*
  # Operation (deploy/accept-s2/ssh-gate-manifest.json's `ssh.run_command`: auto_approvable=true,
  # blast_radius=medium) — an Operation published with auto_approvable=false can never be flipped to
  # auto-approved by any workspace policy (governance/policy/engine.ts's
  # `operation_not_auto_approvable` branch runs unconditionally, before any workspace-policy check);
  # see docs/runbooks/host-accept-s2.md "已知偏离" for the full reasoning.
  accept-s2-ssh-gate:
    build: { context: ., dockerfile: packages/gatekeeper-base/Dockerfile }
    profiles: ["accept-s2"]
    # gate_token（fix/gate-protocol-hardening）：startGatekeeperServer()'s main() refuses to start
    # without a readable GATE_KERNEL_TOKEN_FILE — same compose secret as the other three gate
    # services, default mount path /run/secrets/gate_token.
    secrets: [gate_token]
    environment:
      {
        GATE_TRANSPORT_KIND: ssh,
        GATE_SSH_HOST: accept-s2-sshd,
        GATE_SSH_USER: testuser,
        GATE_SSH_PORT: "22",
        GATE_SSH_IDENTITY_FILE: /data/ssh-identity/id_ed25519,
        # Test fixture only: the sshd container regenerates its host key on every run, so pinning
        # is meaningless here. A real ssh gate pins the target key (`yes` + a known_hosts file).
        GATE_SSH_STRICT_HOST_KEY_CHECKING: "no",
        GATE_SSH_KNOWN_HOSTS_FILE: /dev/null,
        GATE_SSH_POLICY_FILE: "[]",
        GATE_MANIFEST_FILE: /data/gate-manifest.json,
        GATE_PORT: "8090",
      }
    volumes:
      [
        "${NEXTTIME_DATA}/accept-s2/ssh-gate:/data/gate",
        "${NEXTTIME_DATA}/accept-s2/ssh:/data/ssh-identity:ro",
        "./deploy/accept-s2/ssh-gate-manifest.json:/data/gate-manifest.json:ro",
      ]
    networks: [control]
    restart: "no"

  # Generic http-kind Gatekeeper instance fronting accept-s2-openapi. GATE_CREDENTIAL_MODE=
  # connected_account (S2.13's own credentialKind:'connected_account' path — accept_s2.sh's
  # generated bearer token goes straight into this gate's local encrypted ConnectedAccount store,
  # never through the kernel — S2.13's own acceptance sentence "凭证明文不出现在任何内核 DB 表").
  # GATE_STORE_KEY_FILE is generated at accept_s2.sh runtime, same directory convention as the ssh
  # keypair above. deploy/accept-s2/http-gate-manifest.json's one Operation (`stock.get`) is the
  # same shape `@nexttime/gatekeeper-base`'s `importOpenApi` deterministically derives from
  # accept-s2-openapi's own openapi.json — see that manifest file's own header comment for why both
  # copies must agree.
  accept-s2-http-gate:
    build: { context: ., dockerfile: packages/gatekeeper-base/Dockerfile }
    profiles: ["accept-s2"]
    # gate_token：见 accept-s2-ssh-gate 服务块自己的注释。
    secrets: [gate_token]
    environment:
      {
        GATE_TRANSPORT_KIND: http,
        GATE_TARGET_BASE_URL: http://accept-s2-openapi:8080,
        GATE_CREDENTIAL_MODE: connected_account,
        GATE_STORE_KEY_FILE: /data/gate/store.key,
        GATE_MANIFEST_FILE: /data/gate-manifest.json,
        GATE_PORT: "8090",
      }
    volumes:
      [
        "${NEXTTIME_DATA}/accept-s2/http-gate:/data/gate",
        "./deploy/accept-s2/http-gate-manifest.json:/data/gate-manifest.json:ro",
      ]
    networks: [control]
    restart: "no"

  # The deterministic restart target for S2.12 step 2 ("重启测试容器") — the already-deployed
  # `gatekeeper-docker` service (not part of this profile; see docs/runbooks/host-gatekeepers.md)
  # restarts this container via `container.restart`, never a real business container (host-
  # gatekeepers.md's own "不做": "不对现有业务容器 execute").
  accept-s2-restart-target:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    profiles: ["accept-s2"]
    networks: [control]
    restart: "no"

  backup:
    image: postgres:17-alpine # 与 postgres 同大版本
    entrypoint: ["/bin/sh", "/backup.sh"] # 每日 pg_dump + workspaces/config/gatekeepers/caddy tar.gz，保留 N 份（S1.12）
    # Mounts narrowed (lane-7 P2 fix) from one blanket rw `${NEXTTIME_DATA}:/data` (which handed
    # this container write access to pgdata/, secrets/, and every other host-data subtree it never
    # touches) to exactly what deploy/backup/backup.sh reads (ro) and writes (rw): workspaces/
    # config/ gatekeepers/ caddy/ are backup *sources*, never destinations — secrets/ is
    # deliberately absent (never backed up, see backup.sh's own header comment); backups/ is the
    # one directory this container actually writes to.
    volumes:
      [
        "./deploy/backup/backup.sh:/backup.sh:ro",
        "${NEXTTIME_DATA:?}/workspaces:/data/workspaces:ro",
        "${NEXTTIME_DATA:?}/config:/data/config:ro",
        "${NEXTTIME_DATA:?}/gatekeepers:/data/gatekeepers:ro",
        "${NEXTTIME_DATA:?}/caddy:/data/caddy:ro",
        "${NEXTTIME_DATA:?}/backups:/data/backups",
      ]
    environment: { TZ: "${TZ:-UTC}", BACKUP_TIME: "${BACKUP_TIME:-03:30}", RETENTION: "${BACKUP_RETENTION:-7}", PGHOST: postgres, HOME: /tmp }
    depends_on: { postgres: { condition: service_healthy } }
    secrets: [pg_password]
    networks: [control]
    restart: unless-stopped
    # Runs as the image's default ROOT, deliberately, with `cap_drop: [ALL]` + a single
    # `cap_add: [DAC_READ_SEARCH]` (2026-09-08 host correction of fix/socket-proxy-and-backup-user,
    # which had set `user: "10001:10001"`): Docker grants `cap_add` capabilities to the container's
    # *bounding* set only — a non-root `user:` starts with empty permitted/effective sets, so
    # DAC_READ_SEARCH was never in force. Measured on the target host from inside this service:
    # as 10001 `CapEff: 0000000000000000` and `/run/secrets/pg_password` (root 0600, as Docker
    # mounts secrets) unreadable → pg_dump "no password supplied"; as root with only this cap
    # `CapEff: 0000000000000004`, secret and caddy/'s root-0600 keys both readable. Root here is
    # bounded by: no capabilities except read/search-bypass (no DAC_OVERRIDE, no CHOWN, no
    # SETUID…), read-only rootfs, `no-new-privileges`, and mounts limited to the ro backup sources
    # plus the rw backups/ directory — it cannot write anywhere it could not already, and cannot
    # touch the Docker socket or other services. The alternative (non-root + world-readable
    # secret/caddy files) would weaken the host filesystem to make the container look better.
    # backup.sh itself needs nothing else from root: no chown, writes only under
    # $DATA_DIR/backups (rw mount) and /tmp (tmpfs below). `HOME=/tmp` stays as a harmless
    # fallback for any tool probing $HOME.
    # cap_add: [DAC_READ_SEARCH] — the one capability, needed for `caddy/` specifically (and,
    # as measured, for the root-0600 pg_password secret):
    # `deploy/caddy/Dockerfile` runs caddy as the image's default ROOT user (that service's own
    # comment), and its cert/key storage (Caddy's internal-CA "on_demand" TLS, `caddyserver/
    # certmagic`'s `FileStorage` — verified by reading certmagic's actual filestorage.go /
    # internal/atomicfile/file.go source at its current tag, not assumed) hardcodes every write to
    # mode 0600 (files) / 0700 (dirs), root-owned, via an atomic temp-file-then-rename — a mode
    # neither a pre-applied `chmod -R o+rX` nor a `chown -R :10001` + setgid on caddy/ survives,
    # because rename() replaces the whole inode (old permissions/ACLs don't carry over) and
    # certmagic's own explicit chmod(0600) call would zero the group's permission bits again even
    # if the new file's group happened to be inherited as 10001 via setgid. A plain non-root uid
    # 10001 therefore CANNOT read caddy/'s on-demand-issued certs/keys through ordinary DAC
    # permission bits at all — not "usually", structurally, on every fresh issuance (which
    # `on_demand` TLS can trigger on any new SNI, not just periodic renewal). DAC_READ_SEARCH
    # (documented by Docker itself as the capability backup tools use for exactly this) bypasses
    # read/directory-search permission checks without granting DAC_OVERRIDE's write bypass —
    # narrower than the root this container used to run as, and it's the only mechanism (short of
    # running as root again) that makes `tar`'s walk of caddy/ reliable regardless of when it runs
    # relative to caddy's last cert write. See docs/runbooks/backup-restore.md for the operator-
    # facing version of this and the one-time `chmod -R o+rX` baseline host-env-init.sh still
    # applies (belt-and-suspenders for pre-existing files; not load-bearing for correctness — this
    # capability is). `read_only`/`no-new-privileges` remain real, uid-independent restrictions.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]

networks:
  control: { ipam: { config: [{ subnet: "${NEXTTIME_SUBNET_CONTROL:?}" }] } }
  workers: { internal: true, ipam: { config: [{ subnet: "${NEXTTIME_SUBNET_WORKERS:?}" }] } }
  # dockerapi (fix/socket-proxy-and-backup-user): docker-socket-proxy + its two consumers
  # (agent-host, worker-supervisor) only — `internal: true` so nothing on it can reach the
  # public internet even if the proxy itself were compromised. No explicit `ipam.config.subnet`
  # (unlike `workers` above): nothing outside this file reads this network's subnet the way
  # NEXTTIME_SUBNET_WORKERS is read by kernel/egress-proxy's own trust-boundary logic, so letting
  # Docker auto-assign one is fine and avoids adding another required `.env` placeholder.
  dockerapi: { internal: true }
  # dockerapi-gate (fix/gate-docker-socket-proxy): docker-socket-proxy-gate + gatekeeper-docker
  # only — deliberately disjoint from `dockerapi` above (one instance/network per trust boundary,
  # see `docker-socket-proxy-gate`'s own comment for why gatekeeper-docker doesn't just join
  # `dockerapi` and share the first proxy). Same `internal: true` / no explicit subnet reasoning
  # as `dockerapi` above.
  dockerapi-gate: { internal: true }
  # dockerapi-collector (S3.3): docker-socket-proxy-collector + collector-host-inventory only —
  # same disjoint-per-trust-boundary reasoning as dockerapi/dockerapi-gate above.
  dockerapi-collector: { internal: true }
secrets:
  pg_password: { file: "${NEXTTIME_DATA}/secrets/pg_password" }
  handle_key: { file: "${NEXTTIME_DATA}/secrets/handle.key" } # scripts/gen-handle-keys.sh；0640 组 10001
  internal_token: { file: "${NEXTTIME_DATA}/secrets/internal.token" } # scripts/gen-handle-keys.sh；0640 组 10001
  gate_token: { file: "${NEXTTIME_DATA}/secrets/gate.token" } # scripts/gen-handle-keys.sh；0640 组 10001；fix/gate-protocol-hardening
  # collector_host_inventory_token (S3.3): the host-inventory collector's own scoped Handle bearer
  # token — minted by an operator running `bootstrap.js issue-service-handle` (docs/runbooks/
  # host-collector.md), never generated by this compose file. 0640 组 10001 — same permission
  # convention as every other secret file here.
  collector_host_inventory_token: { file: "${NEXTTIME_DATA}/secrets/collector-host-inventory.token" }
