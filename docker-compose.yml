# Deployment skeleton per docs/graph-ai-middle-platform-design.md §10.2.
# All ${...} placeholders are resolved from .env on the target host (see .env.example);
# real values live in docs/private/ (not tracked). Do not hardcode real hosts/paths/credentials
# here.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: nexttime, POSTGRES_USER: nexttime, POSTGRES_PASSWORD_FILE: /run/secrets/pg_password }
    volumes: ["${NEXTTIME_DATA}/pgdata:/var/lib/postgresql/data"]
    secrets: [pg_password]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexttime"], interval: 10s, retries: 5 }
    restart: unless-stopped
    networks: [control]

  kernel:
    build: { context: ., dockerfile: packages/kernel/Dockerfile }
    env_file: ${NEXTTIME_DATA}/secrets/kernel.env # DB URL、Handle 密钥文件路径；无任何外部凭证（I9）
    secrets: [handle_key] # Handle 签名私钥只进这一个容器：/run/secrets/handle_key
    # AGENT_RUNTIME=agent-host 现在是默认值（S1.5 后半：真正的 agent-host 事件桥落地）——仍可在
    # .env 里覆盖回 fake（AGENT_RUNTIME=fake）以跳过整条容器/pi 链路。KERNEL_LLM_URL 是
    # AgentHostRuntime 塞进每个 startTurn 命令里的 llmUrl（packages/kernel/src/index.ts
    # createBackgroundServices 的默认值与此一致，这里显式写出以便一眼看到）。
    # ENTRY_HANDLE_TTL_SECONDS / AGENT_HOST_TURN_ACCEPTED_TIMEOUT_MS 留空用代码内默认值
    # （分别是 86400 与 30000）。SUPERVISOR_URL（S2.7）：internal task/invoke_worker 通过
    # adapters/supervisor-client 调用 worker-supervisor 的 Task 模式 API（POST /task/spawn 等）；
    # 与 agent-host 使用同一个值——kernel 已在 [control, workers] 网络上，能直接到达
    # worker-supervisor:8081。TASK_REAPER_INTERVAL_MS 留空用代码内默认值（30s）。
    environment:
      {
        AGENT_RUNTIME: "${AGENT_RUNTIME:-agent-host}",
        KERNEL_LLM_URL: http://llm-proxy:8082,
        SUPERVISOR_URL: http://worker-supervisor:8081,
      }
    # sessions/ 顶层挂载已在 main 移除（PR #29：worker-supervisor 侧从未用到它，S1.5a 已记录这个
    # 偏离——见 docs/development-tasks.md S1.5a 实现说明"sessions/ 顶层目录本次未使用"）；
    # 这里跟随同一决定，不再补上。
    volumes: ["${NEXTTIME_DATA}/config:/data/config:ro"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [control, workers]
    restart: unless-stopped

  agent-host:
    build: { context: ., dockerfile: packages/agent-host/Dockerfile }
    environment:
      {
        KERNEL_URL: http://kernel:8080,
        SUPERVISOR_URL: http://worker-supervisor:8081,
        KERNEL_LLM_URL: http://llm-proxy:8082,
      }
    # docker.sock 只读挂载：这一半任务把容器 stdio 附着(attach)放在 agent-host 自己（不是扩到
    # worker-supervisor 的 API），见 packages/agent-host/src/container-io.ts 的模块注释——理由是
    # worker-supervisor 已在 S1.5a 完成主机验收，保持它不动；agent-host 只做 docker attach，不
    # create/start/stop 容器，只读挂载已经是这条边界能给的最小权限。group_add 与
    # worker-supervisor 同理：非 root（uid 10001）需要主机 docker 组 gid 才能连 socket
    # （即使只读也一样，docker.sock 的可读性同样由属组决定）。
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    group_add: ["${DOCKER_GID:-999}"]
    networks: [control] # 只到 kernel 与 supervisor；不挂载任何用户目录
    restart: unless-stopped

  worker-supervisor:
    build: { context: ., dockerfile: packages/worker-supervisor/Dockerfile }
    # docker.sock: talks to the Engine API directly (dockerode), no docker CLI needed in the
    # image. workspaces: rw — this is where per-principal directories get created (I15) and
    # bind-mounted (as HOST paths, via NEXTTIME_DATA below) into spawned containers. config: ro
    # for models.json's bind-mount source and general config visibility, EXCEPT
    # egress-sources.json — that single file is re-mounted read-write on top so this service can
    # register/unregister spawned containers' IPs with @nexttime/egress-proxy's SOURCE_MAP_FILE
    # (S1.5a task brief: that package exposes no admin registration endpoint — verified reading
    # packages/egress-proxy/src/admin.ts — so the documented file-based contract is the only
    # integration point; see packages/worker-supervisor/src/egress-map.ts).
    # group_add: the container runs as non-root uid 10001 (packages/worker-supervisor/Dockerfile,
    # same as every other @nexttime/* image), but /var/run/docker.sock on the host is owned
    # root:docker mode 660 — verified on the target host (host-worker-runtime.md verification):
    # without this, connecting to the socket fails EACCES and the process exits immediately
    # (crash loop). DOCKER_GID must be the *host's* `docker` group gid (`stat -c '%g'
    # /var/run/docker.sock`), which varies by host — set it in `.env`; 999 is only a common
    # Debian/Ubuntu default, not guaranteed.
    group_add: ["${DOCKER_GID:-999}"]
    volumes:
      [
        "/var/run/docker.sock:/var/run/docker.sock",
        "${NEXTTIME_DATA}/workspaces:/data/workspaces",
        "${NEXTTIME_DATA}/config:/data/config:ro",
        "${NEXTTIME_DATA}/config/egress-sources.json:/data/config/egress-sources.json",
      ]
    # NEXTTIME_DATA here is the HOST path (not this container's own /data/workspaces mount) —
    # required to compute bind-mount *sources* for the containers this service asks the Docker
    # daemon to create: the daemon resolves those against the host filesystem, not this
    # container's mount namespace (packages/worker-supervisor/src/config.ts doc comment).
    # KERNEL_URL/KERNEL_LLM_URL/HTTP_PROXY_FOR_WORKERS are this service's own defaults for a
    # `/resident/spawn` request that omits `kernelUrl`/`llmUrl`, and the fixed value every
    # spawned container's HTTP(S)_PROXY gets. NETWORK_WORKERS is left unset here — the actual
    # Compose-prefixed network name is resolved at startup from the `com.docker.compose.network`
    # label Compose stamps on the `workers` network (docker-client.ts
    # `resolveNetworkByComposeLabel`); set it explicitly only if that resolution ever needs a
    # manual override.
    # TASK_MAX_RUNTIME_SEC/TASK_WORKDIR_RETENTION_HOURS (S2.8, one-shot Task mode): both already
    # have safe built-in defaults (packages/worker-supervisor/src/config.ts) — passed through here,
    # like WORKER_RUNTIME above, only so an operator can override them via `.env` without editing
    # this file.
    environment:
      {
        WORKER_IMAGE: nexttime-ai-worker-runtime,
        WORKER_RUNTIME: "${WORKER_RUNTIME:-runc}",
        NEXTTIME_DATA: "${NEXTTIME_DATA}",
        KERNEL_URL: http://kernel:8080,
        KERNEL_LLM_URL: http://llm-proxy:8082,
        HTTP_PROXY_FOR_WORKERS: http://egress-proxy:3128,
        TASK_MAX_RUNTIME_SEC: "${TASK_MAX_RUNTIME_SEC:-3600}",
        TASK_WORKDIR_RETENTION_HOURS: "${TASK_WORKDIR_RETENTION_HOURS:-72}",
      }
    networks: [control]
    restart: unless-stopped

  # build-only: exists so `docker compose build worker-runtime` produces the
  # `nexttime-ai-worker-runtime` image worker-supervisor's resident mode spawns by name (its
  # `WORKER_IMAGE` env above) — this service itself is never `up` (deploy/worker-runtime/
  # Dockerfile; docs/runbooks/host-worker-runtime.md has the build/spawn walkthrough).
  worker-runtime:
    build: { context: ., dockerfile: deploy/worker-runtime/Dockerfile }
    image: nexttime-ai-worker-runtime
    profiles: ["build-only"]

  # gatekeeper-docker: talks to the host's own Docker Engine API via dockerode (gatekeepers/docker
  # — no docker CLI in the image). Runs as non-root uid 10001 (gatekeepers/docker/Dockerfile,
  # same pattern as worker-supervisor/agent-host); group_add gives it the host's docker group gid
  # as a supplementary group so it can reach /var/run/docker.sock (root:docker, mode 660).
  # GATE_DATA_DIR only holds the idempotency store (no ConnectedAccount store — this gate uses no
  # per-user credential, see gatekeepers/docker/README.md).
  gatekeeper-docker:
    build: { context: ., dockerfile: gatekeepers/docker/Dockerfile }
    volumes:
      [
        "/var/run/docker.sock:/var/run/docker.sock",
        "${NEXTTIME_DATA}/gatekeepers/docker:/data/gate",
      ]
    group_add: ["${DOCKER_GID:-999}"]
    networks: [control]
    restart: unless-stopped

  # gatekeeper-ragflow: http-kind gate for a RAGFlow instance's REST API (gatekeepers/ragflow).
  # RAGFLOW_BASE_URL / GATE_CREDENTIAL_RAGFLOW_API_KEY come from the env_file below — never
  # hardcoded here (§11 "凭证不进内核进程", same rule applied to this gate's own compose service).
  gatekeeper-ragflow:
    build: { context: ., dockerfile: gatekeepers/ragflow/Dockerfile }
    env_file: ${NEXTTIME_DATA}/secrets/gatekeeper-ragflow.env
    volumes: ["${NEXTTIME_DATA}/gatekeepers/ragflow:/data/gate"]
    networks: [control]
    restart: unless-stopped

  caddy:
    build: { context: ., dockerfile: deploy/caddy/Dockerfile } # caddy:2.10 + 内建 web 静态产物（E8 + S1.8）
    image: nexttime-ai-caddy
    ports: ["${KERNEL_BIND_ADDR}:8443:8443"]
    # Static roots ship inside the image: deploy/caddy/Dockerfile builds packages/web and copies
    # dist/ to /srv/web (/srv/explorer stays a placeholder until S3). Rebuild the image to deploy
    # a web change. ${NEXTTIME_DATA}/caddy:/data persists the internal CA and issued certs
    # (chowned by scripts/host-env-init.sh).
    volumes: ["./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "${NEXTTIME_DATA}/caddy:/data"]
    depends_on: [kernel]
    networks: [control]
    restart: unless-stopped
    # Runs as the image's default root user: the official caddy:2.10 image declares /config as
    # a second VOLUME (autosave state) that isn't bind-mounted here, and it is root-owned inside
    # the image — a non-root `user:` override here would need that path pre-chowned too (or
    # redirected via XDG_CONFIG_HOME), which needs a custom Dockerfile out of E8's scope. Only
    # /data (TLS private keys) is security-sensitive here, and it is already the pre-chowned,
    # bind-mounted, persisted volume regardless of which user writes to it. Raised in the PR
    # body as a follow-up candidate, not decided unilaterally here.

  llm-proxy:
    build: { context: ., dockerfile: packages/llm-proxy/Dockerfile }
    env_file: ${NEXTTIME_DATA}/secrets/llm-proxy.env # provider keys 只在这里
    volumes: ["${NEXTTIME_DATA}/config/llm-providers.yaml:/data/config/llm-providers.yaml:ro", "${NEXTTIME_DATA}/config/handle.pub:/data/config/handle.pub:ro"]
    environment: { KERNEL_URL: http://kernel:8080, HANDLE_PUBLIC_KEY_FILE: /data/config/handle.pub, LLM_PROXY_PORT: 8082 }
    networks: [control, workers]
    restart: unless-stopped

  egress-proxy:
    build: { context: ., dockerfile: packages/egress-proxy/Dockerfile }
    volumes: ["${NEXTTIME_DATA}/config/egress-sources.json:/data/config/egress-sources.json:ro"]
    environment: { KERNEL_URL: http://kernel:8080, NEXTTIME_SUBNET_CONTROL: "${NEXTTIME_SUBNET_CONTROL}", NEXTTIME_SUBNET_WORKERS: "${NEXTTIME_SUBNET_WORKERS}", SOURCE_MAP_FILE: /data/config/egress-sources.json, EGRESS_TRUSTED_RESOLVED_CIDRS: "${EGRESS_TRUSTED_RESOLVED_CIDRS:-}", EGRESS_DENY_HOST_SUFFIXES: "${EGRESS_DENY_HOST_SUFFIXES:-}" }
    networks: [control, workers]
    restart: unless-stopped

  # 仅测试/验收用（S1.10 accept_s1.sh 与本任务的主机验收）：确定性的 OpenAI 兼容假上游，见
  # deploy/fake-llm/server.mjs 与 config/llm-providers.fake.example.yaml。`profiles: ["test"]`——
  # 默认 `docker compose up` 不会拉起它；换真实 provider只需编辑
  # ${NEXTTIME_DATA}/config/llm-providers.yaml + secrets/llm-proxy.env，不改这个 compose 文件。
  fake-llm:
    build: { context: ., dockerfile: deploy/fake-llm/Dockerfile }
    profiles: ["test"]
    networks: [control]
    restart: unless-stopped

  # accept-s2 (S2.12 acceptance-only fixtures; profiles: ["accept-s2"] — never started by plain
  # `docker compose up`). scripts/accept_s2.sh drives all of these; see
  # docs/runbooks/host-accept-s2.md for the full flow and docs/development-tasks.md S2.12 for the
  # seven acceptance steps these back. All five reuse the existing `control` network rather than a
  # new dedicated one: `application/gateway/connection-handlers.ts`'s `create_connection` fetches
  # `manifestSource` (the OpenAPI document) directly from the *kernel* process, so the openapi
  # fixture must be reachable from `control` regardless; putting the sshd fixture on a separate
  # network while `kernel` (which cannot gain a third network without editing its own already-
  # existing service block, outside this file's additive-only scope) stays off it would not add any
  # real isolation — a spawned Worker container only ever gets the isolated `workers` network
  # (S2.8's spawn spec), so it is exactly as unreachable to every one of these five services as it
  # already is to postgres/kernel/gatekeeper-docker on `control` today. See
  # docs/runbooks/host-accept-s2.md "已知偏离" for the full reasoning.

  # A container-simulated "test SSH host" (S2.12 deliverable 1a). Pubkey-only auth — the private
  # half of the keypair is generated at accept_s2.sh runtime into ${NEXTTIME_DATA}/accept-s2/ssh/
  # and never committed to the repo; see deploy/accept-s2/sshd/Dockerfile's own header comment.
  accept-s2-sshd:
    build: { context: ., dockerfile: deploy/accept-s2/sshd/Dockerfile }
    profiles: ["accept-s2"]
    volumes: ["${NEXTTIME_DATA}/accept-s2/ssh/id_ed25519.pub:/etc/accept-s2/authorized_keys:ro"]
    networks: [control]
    restart: "no"

  # A test OpenAPI service (S2.12 deliverable 1b) — serves both the OpenAPI document
  # `create_connection`'s `manifestSource` imports from and the one real `/stock` operation
  # (bearer-token gated, ACCEPT_S2_API_TOKEN generated at accept_s2.sh runtime — never a value
  # baked into this file). See deploy/accept-s2/openapi-fixture/server.mjs's own header comment.
  # `:-` (not `:?`): compose interpolates every service's `environment:` block for the *whole*
  # file before profile filtering ever runs, so a `:?` default here would make every ordinary
  # `docker compose up/ps/build` on the host (for any service, not just this profile) fail with
  # this message whenever ACCEPT_S2_API_TOKEN happens to be unset in the shell/`.env` — i.e.
  # always, outside of accept_s2.sh's own run. `deploy/accept-s2/openapi-fixture/server.mjs`
  # already refuses to start with an empty/missing token (see that file's own header comment), so
  # an accidental `docker compose --profile accept-s2 up` without the token set fails loudly
  # inside the container instead, not at compose-parse time for every other command.
  accept-s2-openapi:
    build: { context: ., dockerfile: deploy/accept-s2/openapi-fixture/Dockerfile }
    profiles: ["accept-s2"]
    environment: { ACCEPT_S2_API_TOKEN: "${ACCEPT_S2_API_TOKEN:-}" }
    networks: [control]
    restart: "no"

  # Generic ssh-kind Gatekeeper instance — packages/gatekeeper-base's own env-driven main()
  # (docs/runbooks/host-gatekeepers.md's §2/§3 pattern for docker/ragflow, applied directly to the
  # base image here since this connection has no dedicated `gatekeepers/<system>` package; see
  # packages/gatekeeper-base/src/index.ts's own "the common http/cli/ssh single-transport case"
  # main() doc comment). GATE_SSH_POLICY_FILE is deliberately `[]` — every command this gate's own
  # SshTransport runs is therefore "unclassified" by its internal classifyCommand (informational
  # only, packages/gatekeeper-base/src/kinds/ssh.ts — never consulted by kernel governance). S2.12
  # step 4's approval-card / "always allow" behavior is instead driven by this gate's *published*
  # Operation (deploy/accept-s2/ssh-gate-manifest.json's `ssh.run_command`: auto_approvable=true,
  # blast_radius=medium) — an Operation published with auto_approvable=false can never be flipped to
  # auto-approved by any workspace policy (governance/policy/engine.ts's
  # `operation_not_auto_approvable` branch runs unconditionally, before any workspace-policy check);
  # see docs/runbooks/host-accept-s2.md "已知偏离" for the full reasoning.
  accept-s2-ssh-gate:
    build: { context: ., dockerfile: packages/gatekeeper-base/Dockerfile }
    profiles: ["accept-s2"]
    environment:
      {
        GATE_TRANSPORT_KIND: ssh,
        GATE_SSH_HOST: accept-s2-sshd,
        GATE_SSH_USER: testuser,
        GATE_SSH_PORT: "22",
        GATE_SSH_IDENTITY_FILE: /data/ssh-identity/id_ed25519,
        GATE_SSH_POLICY_FILE: "[]",
        GATE_MANIFEST_FILE: /data/gate-manifest.json,
        GATE_PORT: "8090",
      }
    volumes:
      [
        "${NEXTTIME_DATA}/accept-s2/ssh-gate:/data/gate",
        "${NEXTTIME_DATA}/accept-s2/ssh:/data/ssh-identity:ro",
        "./deploy/accept-s2/ssh-gate-manifest.json:/data/gate-manifest.json:ro",
      ]
    networks: [control]
    restart: "no"

  # Generic http-kind Gatekeeper instance fronting accept-s2-openapi. GATE_CREDENTIAL_MODE=
  # connected_account (S2.13's own credentialKind:'connected_account' path — accept_s2.sh's
  # generated bearer token goes straight into this gate's local encrypted ConnectedAccount store,
  # never through the kernel — S2.13's own acceptance sentence "凭证明文不出现在任何内核 DB 表").
  # GATE_STORE_KEY_FILE is generated at accept_s2.sh runtime, same directory convention as the ssh
  # keypair above. deploy/accept-s2/http-gate-manifest.json's one Operation (`stock.get`) is the
  # same shape `@nexttime/gatekeeper-base`'s `importOpenApi` deterministically derives from
  # accept-s2-openapi's own openapi.json — see that manifest file's own header comment for why both
  # copies must agree.
  accept-s2-http-gate:
    build: { context: ., dockerfile: packages/gatekeeper-base/Dockerfile }
    profiles: ["accept-s2"]
    environment:
      {
        GATE_TRANSPORT_KIND: http,
        GATE_TARGET_BASE_URL: http://accept-s2-openapi:8080,
        GATE_CREDENTIAL_MODE: connected_account,
        GATE_STORE_KEY_FILE: /data/gate/store.key,
        GATE_MANIFEST_FILE: /data/gate-manifest.json,
        GATE_PORT: "8090",
      }
    volumes:
      [
        "${NEXTTIME_DATA}/accept-s2/http-gate:/data/gate",
        "./deploy/accept-s2/http-gate-manifest.json:/data/gate-manifest.json:ro",
      ]
    networks: [control]
    restart: "no"

  # The deterministic restart target for S2.12 step 2 ("重启测试容器") — the already-deployed
  # `gatekeeper-docker` service (not part of this profile; see docs/runbooks/host-gatekeepers.md)
  # restarts this container via `container.restart`, never a real business container (host-
  # gatekeepers.md's own "不做": "不对现有业务容器 execute").
  accept-s2-restart-target:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    profiles: ["accept-s2"]
    networks: [control]
    restart: "no"

  backup:
    image: postgres:17-alpine # 与 postgres 同大版本
    entrypoint: ["/bin/sh", "/backup.sh"] # 每日 pg_dump + workspaces/config tar.gz，保留 N 份（S1.12）
    volumes: ["./deploy/backup/backup.sh:/backup.sh:ro", "${NEXTTIME_DATA}:/data"]
    environment: { TZ: "${TZ:-UTC}", BACKUP_TIME: "${BACKUP_TIME:-03:30}", RETENTION: "${BACKUP_RETENTION:-7}", PGHOST: postgres }
    depends_on: { postgres: { condition: service_healthy } }
    secrets: [pg_password]
    networks: [control]
    restart: unless-stopped

networks:
  control: { ipam: { config: [{ subnet: "${NEXTTIME_SUBNET_CONTROL}" }] } }
  workers: { internal: true, ipam: { config: [{ subnet: "${NEXTTIME_SUBNET_WORKERS}" }] } }
secrets:
  pg_password: { file: "${NEXTTIME_DATA}/secrets/pg_password" }
  handle_key: { file: "${NEXTTIME_DATA}/secrets/handle.key" } # scripts/gen-handle-keys.sh；0640 组 10001
